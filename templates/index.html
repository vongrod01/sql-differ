<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- No icon: served by the web app, the browser would ask it for one that is not there. -->
<link rel="icon" href="data:,">
<title>เทียบโครงสร้างฐานข้อมูล: หลายฐาน</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #0b0d13;
    --panel: #151922;
    --text: #f2f3f5;
    --muted: #a3a6b0;
    --line: rgba(255, 255, 255, .12);
    --head: #222836;
    --accent: #6cb2ff;
    --accent-rgb: 10, 132, 255;
    --add: #34d65c;
    --add-bg: rgba(48, 209, 88, .17);
    --del: #ff6f66;
    --del-bg: rgba(255, 69, 58, .17);
    --chg: #ffb02e;
    --chg-bg: rgba(255, 159, 10, .17);
    --unk: #c3c6cf;
    --unk-bg: rgba(255, 255, 255, .10);
    --warn-line: rgba(255, 159, 10, .42);
    --err-bg: rgba(255, 69, 58, .17);
    --code-bg: #0d1017;
    --add-row: rgba(48, 209, 88, .22);
    --del-row: rgba(255, 69, 58, .24);
    --tint-add: linear-gradient(180deg, rgba(48, 209, 88, .40), rgba(48, 209, 88, .16)), var(--fill-reg);
    --tint-del: linear-gradient(180deg, rgba(255, 69, 58, .40), rgba(255, 69, 58, .16)), var(--fill-reg);
    --tint-chg: linear-gradient(180deg, rgba(255, 159, 10, .40), rgba(255, 159, 10, .16)), var(--fill-reg);
    --tint-unk: linear-gradient(180deg, rgba(255, 255, 255, .18), rgba(255, 255, 255, .06)), var(--fill-reg);
    --line-add: rgba(48, 209, 88, .45);
    --line-del: rgba(255, 69, 58, .45);
    --line-chg: rgba(255, 159, 10, .45);
    --fill-clear: #242a36;
    --fill-reg: #171b26;
    --fill-inset: #0d1017;
    --edge: 0 0 0 transparent;
    --edge-line: rgba(255, 255, 255, .12);
    --lift: 0 0 0 transparent;
    --blur: none;
    --font-body: "Leelawadee UI", "Segoe UI", Tahoma, sans-serif;
    --font-code: Consolas, "Cascadia Mono", "Leelawadee UI", monospace;
  }
  /* Keep controls distinct when increased contrast is requested. */
  @media (prefers-reduced-transparency: reduce), (forced-colors: active) {
    :root { --fill-clear: #2a3040; --fill-reg: #171b26; --fill-inset: #0d1017; --blur: none; --edge-line: rgba(255, 255, 255, .28); }
  }
  @media (prefers-contrast: more) {
    :root { --fill-clear: #2a3040; --fill-reg: #171b26; --fill-inset: #0d1017; --edge-line: rgba(255, 255, 255, .45); --muted: #c4c7cf; }
  }
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    :root { --fill-clear: #2a3040; --fill-reg: #171b26; --blur: none; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; min-height: 100vh; background: var(--bg); color: var(--text); font: 15px/1.6 var(--font-body); }
  a { color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 16px 72px; display: grid; gap: 18px; }
  .note { font-size: 14px; color: var(--muted); }
  h1 { font-size: 26px; line-height: 1.3; margin: 0; font-weight: 650; }
  h2 { font-size: 18px; margin: 0; font-weight: 650; }
  .lead { margin: 0; max-width: 75ch; }

  /* The two databases */
  .pair { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: stretch; }
  .db { background: var(--fill-reg); border: 1px solid var(--edge-line); border-radius: var(--r-lg, 20px); padding: 12px 18px; min-width: 0; box-shadow: var(--edge), var(--lift); }
  .db.model { border-color: rgba(var(--accent-rgb), .65); }
  .db .role { font-size: 14px; color: var(--muted); }
  .db .name { font-family: var(--font-code); font-size: 16px; font-weight: 650; overflow-wrap: anywhere; }
  .arrow { align-self: center; color: var(--muted); font-size: 14px; text-align: center; line-height: 1.3; }
  .arrow b { display: block; font-size: 24px; color: var(--text); }
  .warn { padding: 12px 16px; border-radius: 18px; background: var(--tint-chg); border: 1px solid var(--warn-line); word-break: break-word; box-shadow: var(--edge); }
  .warn b { display: block; }

  /* Status colours distinguish the four kinds of difference. */
  .legend { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .kind { background: var(--fill-reg); border: 1px solid var(--edge-line); border-radius: 20px; padding: 10px 16px 12px; display: grid; gap: 4px; align-content: start; text-align: left; font: inherit; color: inherit; box-shadow: var(--edge), var(--lift); }
  .kind .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
  .kind .n { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .kind .t { font-weight: 650; }
  .kind .d { font-size: 14px; color: #c3c6cf; }
  .kind.add, .kind:has(.n.add) { background: var(--tint-add); border-color: var(--line-add); }
  .kind.del, .kind:has(.n.del) { background: var(--tint-del); border-color: var(--line-del); }
  .kind.chg, .kind:has(.n.chg) { background: var(--tint-chg); border-color: var(--line-chg); }
  .kind.unk, .kind:has(.n.unk) { background: var(--tint-unk); }
  .kind.add .n, .kind.add .t { color: var(--add); }
  .kind.del .n, .kind.del .t { color: var(--del); }
  .kind.chg .n, .kind.chg .t { color: var(--chg); }
  .kind.unk .n, .kind.unk .t { color: var(--unk); }

  .panel { background: var(--fill-reg); border: 1px solid var(--edge-line); border-radius: 24px; min-width: 0; box-shadow: var(--edge), var(--lift); }
  .empty { padding: 28px 16px; text-align: center; color: var(--muted); }

  /* Print as a light page with dark text. */
  @media print {
    :root {
      color-scheme: light; --text: #111; --muted: #444; --line: #bbb; --edge-line: #bbb; --head: #eee; --accent: #1d4fc0;
      --add: #116b2f; --add-bg: #e3f3e8; --del: #a8261c; --del-bg: #fbe9e7; --chg: #7a5200; --chg-bg: #fdf1d3; --unk: #444; --unk-bg: #eee;
      --warn-line: #c9a227; --err-bg: #fbe9e7; --code-bg: #f7f7f7; --add-row: #d7efde; --del-row: #f6d9d5;
      --tint-add: #e3f3e8; --tint-del: #fbe9e7; --tint-chg: #fdf1d3; --tint-unk: #eee;
      --line-add: #7bbf8e; --line-del: #d98d86; --line-chg: #d6b25c;
      --fill-clear: #fff; --fill-reg: #fff; --fill-inset: #f4f4f4; --edge: none; --lift: none; --blur: none;
    }
    body { background: #fff; }
  }

  /* One centred column: the two servers, the four words with their totals, then one row per
     database. Opened offline, so system fonts only. Same words and colours as report.html. */
  .group { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
  .wrap { grid-template-columns: minmax(0, 1fr); }
  h2 { margin: 8px 0 0; }
  .add { color: var(--add); }
  .del { color: var(--del); }
  .chg { color: var(--chg); }
  .unk { color: var(--unk); }

  /* One row per database: name, the four counts with their words, the result. */
  .dbrow { display: grid; grid-template-columns: minmax(0, 1.2fr) auto minmax(0, 1fr); gap: 4px 20px; padding: 12px 18px; border-top: 1px solid rgba(255, 255, 255, .09); align-items: baseline; }
  .dbrow:first-child { border-top: 0; }
  .dbrow .name { font-family: var(--font-code); font-weight: 650; overflow-wrap: anywhere; }
  .nums { display: flex; flex-wrap: wrap; gap: 2px 16px; font-size: 14px; }
  .num { min-width: 6.5rem; white-space: nowrap; }
  .num b { display: inline-block; min-width: 2.2rem; text-align: right; font-size: 15px; font-variant-numeric: tabular-nums; }
  .num.zero, .num.zero b { color: var(--muted); font-weight: 400; }
  .res { min-width: 0; word-break: break-word; }
  .res .ok { color: var(--add); font-weight: 650; }
  .res .err { color: var(--del); }
  .res .inc { display: block; font-size: 14px; color: var(--del); }
  .names { background: var(--fill-reg); border: 1px solid var(--edge-line); border-radius: 20px; padding: 12px 18px; word-break: break-word; box-shadow: var(--edge), var(--lift); }

  /* Shared language selector. */
  .langbar { display: flex; justify-content: flex-end; margin-bottom: -6px; }
  .langpick { display: inline-flex; align-items: center; gap: 6px; padding: 5px 6px 5px 14px; background: var(--fill-clear); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    border: 1px solid var(--edge-line); border-radius: 999px; box-shadow: var(--edge), var(--lift); }
  .langpick svg { color: var(--muted); flex-shrink: 0; }
  .langpick select { appearance: none; -webkit-appearance: none; font: inherit; color: var(--text); min-height: 36px; min-width: 76px; padding: 4px 36px 4px 14px; cursor: pointer;
    background-color: var(--fill-inset); border: 1px solid var(--edge-line); border-radius: 999px; box-shadow: inset 0 1px 3px rgba(0, 0, 0, .45);
    background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
    background-position: calc(100% - 19px) 50%, calc(100% - 13px) 50%; background-size: 6px 6px, 6px 6px; background-repeat: no-repeat; }
  .langpick select option { background: #171b26; color: var(--text); }
  .langpick select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  @media (max-width: 860px) {
    .pair { grid-template-columns: minmax(0, 1fr); }
    .arrow b { display: inline-block; transform: rotate(90deg); margin-right: 8px; }
    .legend { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .dbrow { grid-template-columns: minmax(0, 1fr); }
    .num { min-width: 0; }
    .num b { min-width: 0; }
  }
  @media print {
    .langbar { display: none; }
    .panel, .db, .kind { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="langbar">
    <label class="langpick">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c5 5 5 13 0 18-5-5-5-13 0-18Z"/></svg>
      <select id="lang" aria-label="ภาษา" title="ภาษา">
        <option value="th" lang="th">ไทย</option>
        <option value="en" lang="en">Eng</option>
      </select>
    </label>
  </div>
  <header class="group">
    <h1 id="title">เทียบโครงสร้างฐานข้อมูล: หลายฐาน</h1>
    <div class="pair">
      <div class="db model"><div class="role" id="role-source">ต้นแบบ: server ที่ถูกต้อง (source)</div><div class="name" id="m-source"></div></div>
      <div class="arrow"><b>&rarr;</b><span id="arrow-text">ปรับให้เหมือน</span></div>
      <div class="db"><div class="role" id="role-target">ปลายทาง: server ที่จะถูกปรับ (target)</div><div class="name" id="m-target"></div></div>
    </div>
    <p class="lead" id="lead">หน้านี้สรุปผลของฐานข้อมูลชื่อเดียวกันบนสอง server ทีละฐาน กดชื่อฐานเพื่อเปิดรายงานของฐานนั้น</p>
    <div class="note" id="m-options"></div>
    <div class="group" id="warnings"></div>
    <div class="legend" id="legend"></div>
  </header>
  <div class="panel" id="rows"></div>
  <div class="group" id="extra"></div>
</div>
<script>
const INDEX = __INDEX_JSON__;

// The words and the text of a result, kept apart from the page so that a test can run them.
function createIndexCore(lang) {
  'use strict';
  // The words come in two languages, side by side: L(thai, english). The Thai is the original text and what a
  // page in Thai is made of, to the letter; the page asks for the language the person chose (see below).
  const EN = lang === 'en';
  const L = (th, en) => (EN ? en : th);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // The same four words as in the report of one database (templates/report.html).
  const KIND = [
    { key: 'onlyInSource', cls: 'add', sym: '+', t: L('ต้องเพิ่ม', 'To add'), d: L('ต้นแบบมี แต่ปลายทางยังไม่มี sync จะสร้างให้ ยกเว้นส่วนที่ไฟล์ sync เขียนไว้เป็นหมายเหตุให้ทำเอง', 'In the source but not yet in the target. Sync creates it, except for parts the sync file writes as comments for you to run by hand') },
    { key: 'onlyInTarget', cls: 'del', sym: '−', t: L('มีเกิน', 'Extra'), d: L('ปลายทางมีแต่ต้นแบบไม่มี sync ไม่ลบให้ แค่เขียนคำสั่งลบไว้เป็นหมายเหตุ', 'In the target but not in the source. Sync does not delete it; it only writes the delete command as a comment') },
    { key: 'different', cls: 'chg', sym: '~', t: L('ต้องแก้', 'To change'), d: L('มีทั้งคู่แต่ไม่เหมือนกัน sync จะแก้ปลายทางให้ตรงต้นแบบ ยกเว้นส่วนที่ไฟล์ sync เขียนไว้เป็นหมายเหตุให้ทำเอง', 'In both but different. Sync changes the target to match the source, except for parts the sync file writes as comments for you to run by hand') },
    { key: 'unverified', cls: 'unk', sym: '?', t: L('ตรวจไม่ได้', 'Unverified'), d: L('อ่านค่าไม่ได้ (ไม่มีสิทธิ์ หรือถูกเข้ารหัส) จึงเทียบไม่ได้ และไม่เขียนคำสั่งให้', 'Cannot read the value (no permission, or encrypted), so it cannot be compared, and sync writes no command for it') }
  ];
  const SIDE = { source: L('ต้นแบบ', 'source'), target: L('ปลายทาง', 'target') };
  const sides = list => list.map(s => SIDE[s] || s).join(L(' และ ', ' and '));

  // The result of one database as HTML. "ตรงกัน" only when nothing differs, everything could be
  // compared and the login could read everything.
  function resultHtml(row) {
    if (row.error) return `<span class="err">${L('เทียบไม่สำเร็จ', 'Comparison failed')}: ${esc(row.error)}</span>`;
    const total = row.onlyInSource + row.onlyInTarget + row.different;
    const incomplete = row.incomplete && row.incomplete.length
      ? `<span class="inc">${L('ผลไม่ครบ: ไม่มีสิทธิ์ VIEW DEFINITION ฝั่ง', 'Incomplete: no VIEW DEFINITION permission on the ')}${sides(row.incomplete)}</span>` : '';
    if (total > 0) return L(`ต่างกัน ${total} รายการ`, `${total} ${total === 1 ? 'difference' : 'differences'}`) + incomplete;
    if (incomplete) return L('ไม่พบความต่างในส่วนที่อ่านได้', 'No differences found in the parts that could be read') + incomplete;
    if (row.unverified > 0) return L('ไม่พบความต่างในส่วนที่ตรวจได้', 'No differences found in the parts that could be verified');
    return '<span class="ok">' + L('ตรงกัน', 'Identical') + '</span>';
  }

  function rowHtml(row) {
    // A long name may break after a dot or an underscore before it breaks anywhere.
    const shown = esc(row.database).replace(/([._])(?=\S)/g, '$1<wbr>');
    const name = row.report && !row.error ? `<a href="${esc(encodeURIComponent(row.report))}">${shown}</a>` : shown;
    const nums = row.error ? '' : KIND.map(k => {
      const n = row[k.key] || 0;
      return `<span class="num ${n ? k.cls : 'zero'}"><b>${n}</b> ${k.t}</span>`;
    }).join('');
    return `<div class="dbrow"><div class="name">${name}</div><div class="nums">${nums}</div><div class="res">${resultHtml(row)}</div></div>`;
  }

  return { L, esc, KIND, sides, resultHtml, rowHtml };
}

// The page itself. Not run where there is no document (the tests).
if (typeof document !== 'undefined') (function () {
  'use strict';
  // The language is the one chosen on the main page of the app (the same key), and Thai where there is none
  // or the browser keeps nothing. A change of it words the page again in place.
  const LANG_KEY = 'database-diff.language';
  let LANG = 'th';
  try { if (localStorage.getItem(LANG_KEY) === 'en') LANG = 'en'; } catch (e) { /* storage may be blocked */ }
  const L = (th, en) => (LANG === 'en' ? en : th);
  const esc = createIndexCore('th').esc;
  const $ = id => document.getElementById(id);
  // Made at each use: the words depend on the language of the moment.
  const categoryNames = () => ({
    'Database': L('ค่าของฐานข้อมูล', 'database settings'), 'Schema': 'schema', 'Table': L('ตาราง', 'table'), 'Column': L('คอลัมน์', 'column'), 'Index': 'index',
    'Foreign key': 'foreign key', 'Check constraint': 'check constraint', 'View': 'view', 'Stored procedure': 'stored procedure',
    'Function': 'function', 'Trigger': 'trigger', 'User-defined type': L('type ที่สร้างเอง', 'user-defined type'), 'Sequence': 'sequence', 'Synonym': 'synonym'
  });
  const rows = INDEX.rows;
  const compared = rows.filter(r => !r.error);
  const failed = rows.length - compared.length;
  const incomplete = compared.filter(r => r.incomplete && r.incomplete.length).length;

  function render() {
    const core = createIndexCore(LANG);
    document.documentElement.lang = LANG;
    const title = L('เทียบโครงสร้างฐานข้อมูล: หลายฐาน', 'Database structure comparison: multiple databases');
    document.title = title;
    $('title').textContent = title;
    $('role-source').textContent = L('ต้นแบบ: server ที่ถูกต้อง (source)', 'Source: the reference server');
    $('role-target').textContent = L('ปลายทาง: server ที่จะถูกปรับ (target)', 'Target: the server to update');
    $('arrow-text').textContent = L('ปรับให้เหมือน', 'update to match');
    $('lead').textContent = L('หน้านี้สรุปผลของฐานข้อมูลชื่อเดียวกันบนสอง server ทีละฐาน กดชื่อฐานเพื่อเปิดรายงานของฐานนั้น',
      'This page summarizes the databases with the same name on the two servers, one database at a time. Click a database name to open its report.');
    $('lang').value = LANG;
    $('lang').setAttribute('aria-label', L('ภาษา', 'Language'));
    $('lang').title = L('ภาษา', 'Language');
    $('m-source').textContent = INDEX.source;
    $('m-target').textContent = INDEX.target;
    const o = INDEX.options || {};
    const options = [
      o.ignoreWhitespace ? L('ไม่สนช่องว่าง', 'Ignore whitespace') : '', o.ignoreCase ? L('ไม่สนตัวพิมพ์เล็ก/ใหญ่', 'Ignore case') : '',
      o.ignoreCollation ? L('ไม่เทียบ collation', 'Ignore collation') : '', o.compareColumnOrder ? L('เทียบลำดับคอลัมน์ด้วย', 'Compare column order') : ''
    ].filter(Boolean);
    const names = categoryNames();
    $('m-options').textContent = L('สร้างเมื่อ ', 'Created ') + INDEX.generated + L(' · หมวดที่เทียบ: ', ' · Categories compared: ') + INDEX.categories.map(c => names[c] || c).join(', ') +
      (options.length ? L(' · ตัวเลือก: ', ' · Options: ') + options.join(', ') : '');

    let warnings = '';
    if (failed) {
      warnings += L(`<div class="warn"><b>เทียบไม่สำเร็จ ${failed} จาก ${rows.length} ฐาน</b>` +
        'ตัวเลขด้านล่างนับเฉพาะฐานที่เทียบได้ ฐานที่เทียบไม่สำเร็จไม่มีรายงานและไม่มี script</div>',
      `<div class="warn"><b>Comparison failed for ${failed} of ${rows.length} databases</b>` +
        'The counts below include only the databases that could be compared. A database that failed has no report and no script.</div>');
    }
    if (incomplete) {
      warnings += L(`<div class="warn"><b>ผลเทียบไม่ครบ ${incomplete} จาก ${rows.length} ฐาน</b>` +
        'login ไม่มีสิทธิ์ VIEW DEFINITION ในฐานเหล่านั้น: ของที่ login มองไม่เห็นจะขึ้นเป็น "ต้องเพิ่ม" หรือ "มีเกิน" ทั้งที่อาจมีอยู่จริง ' +
        'และโค้ดที่อ่านไม่ได้จะขึ้นเป็น "ตรวจไม่ได้" ให้สิทธิ์ VIEW DEFINITION (หรือ VIEW ANY DEFINITION) แล้วเทียบใหม่เพื่อให้ได้ผลครบ</div>',
      `<div class="warn"><b>Incomplete comparison for ${incomplete} of ${rows.length} databases</b>` +
        `The login has no VIEW DEFINITION permission in those databases: objects it cannot see show up as "${core.KIND[0].t}" or "${core.KIND[1].t}" even though they may really exist, ` +
        `and code it cannot read shows up as "${core.KIND[3].t}". Grant VIEW DEFINITION (or VIEW ANY DEFINITION) and compare again for a complete result.</div>`);
    }
    $('warnings').innerHTML = warnings;
    $('warnings').hidden = !warnings;

    $('legend').innerHTML = core.KIND.map(k => {
      const n = compared.reduce((sum, r) => sum + (r[k.key] || 0), 0);
      return `<div class="kind"><span class="top"><span class="n ${k.cls}">${n}</span><span class="t ${k.cls}">${k.sym} ${k.t}</span></span>` +
        `<span class="d">${esc(k.d)}</span></div>`;
    }).join('');

    $('rows').innerHTML = rows.length ? rows.map(core.rowHtml).join('') : '<div class="empty">' + L('ไม่มีฐานข้อมูลที่ชื่อตรงกันให้เทียบ', 'No databases with matching names to compare') + '</div>';

    let extra = '';
    const list = (head, names) => { if (names && names.length) extra += `<h2>${head}</h2><div class="names">${esc(names.join(', '))}</div>`; };
    list(L('ฐานที่มีแค่บน server ต้นแบบ', 'Databases only on the source server'), INDEX.onlyOnSource);
    list(L('ฐานที่มีแค่บน server ปลายทาง', 'Databases only on the target server'), INDEX.onlyOnTarget);
    list(L('มีทั้งสอง server แต่ login เข้าไม่ได้ (ไม่ได้เทียบ)', 'On both servers but the login cannot access them (not compared)'), (INDEX.noAccess || []).map(d => {
      const missing = core.sides([d.source ? '' : 'source', d.target ? '' : 'target'].filter(Boolean));
      return L(`${d.database} (เข้าไม่ได้ฝั่ง${missing})`, `${d.database} (no access on the ${missing})`);
    }));
    $('extra').innerHTML = extra;
    $('extra').hidden = !extra;
  }

  function setLanguage(next, keep) {
    if (next !== 'th' && next !== 'en') return;
    if (keep !== false) { try { localStorage.setItem(LANG_KEY, next); } catch (e) { /* it still changes for this page */ } }
    if (next === LANG) return;
    LANG = next;
    render();
  }
  $('lang').addEventListener('change', e => setLanguage(e.target.value));
  // Another tab of the app (or of a report) changed it.
  window.addEventListener('storage', e => { if (e.key === LANG_KEY) setLanguage(e.newValue === 'en' ? 'en' : 'th', false); });
  render();
})();
</script>
</body>
</html>
