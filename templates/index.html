<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- No icon: served by the web app, the browser would ask it for one that is not there. -->
<link rel="icon" href="data:,">
<title>เทียบโครงสร้างฐานข้อมูล: หลายฐาน</title>
<style>
  /* Layout: one centred column: the two servers, the four words with their totals, then one row
     per database. Opened offline, so system fonts only. Same words and colours as report.html. */
  :root {
    color-scheme: light dark;
    --bg: #f4f5f8; --panel: #ffffff; --text: #1b2130; --muted: #586375; --line: #dde2ea; --head: #eef1f6;
    --accent: #2c55c9; --add: #17713a; --del: #a8261c; --chg: #855a00; --chg-bg: #fdf1d3; --unk: #4a5462;
    --warn-line: #e7c76a; --err-bg: #fbe9e7;
    --font-body: "Leelawadee UI", "Segoe UI", Tahoma, sans-serif;
    --font-code: Consolas, "Cascadia Mono", "Leelawadee UI", monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #11141a; --panel: #191d25; --text: #e4e8ee; --muted: #9aa5b5; --line: #2b323d; --head: #1f242d;
      --accent: #8fabff; --add: #79d496; --del: #ff9d95; --chg: #e9c262; --chg-bg: #352b14; --unk: #b6c0cd;
      --warn-line: #6b5520; --err-bg: #3a1c1a;
    }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 var(--font-body); }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 24px 16px 64px; display: grid; gap: 18px; grid-template-columns: minmax(0, 1fr); }
  .group { display: grid; gap: 10px; grid-template-columns: minmax(0, 1fr); }
  .note { font-size: 14px; color: var(--muted); }
  h1 { font-size: 24px; line-height: 1.3; margin: 0; }
  h2 { font-size: 18px; margin: 8px 0 0; }
  a { color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .pair { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 10px; align-items: stretch; }
  .db { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; min-width: 0; }
  .db.model { border-color: var(--accent); }
  .db .role { font-size: 14px; color: var(--muted); }
  .db .name { font-family: var(--font-code); font-size: 16px; font-weight: 600; overflow-wrap: anywhere; }
  .arrow { align-self: center; color: var(--muted); font-size: 14px; text-align: center; line-height: 1.3; }
  .arrow b { display: block; font-size: 22px; color: var(--text); }
  .lead { margin: 0; max-width: 75ch; }
  .warn { padding: 10px 14px; border-radius: 10px; background: var(--chg-bg); border: 1px solid var(--warn-line); word-break: break-word; }
  .warn b { display: block; }

  .legend { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
  .kind { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; display: grid; gap: 4px; align-content: start; }
  .kind .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
  .kind .n { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .kind .t { font-weight: 600; }
  .kind .d { font-size: 14px; color: var(--muted); }
  .add { color: var(--add); }
  .del { color: var(--del); }
  .chg { color: var(--chg); }
  .unk { color: var(--unk); }

  /* One row per database: name, the four counts with their words, the result. */
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; min-width: 0; }
  .dbrow { display: grid; grid-template-columns: minmax(0, 1.2fr) auto minmax(0, 1fr); gap: 4px 20px; padding: 10px 16px; border-top: 1px solid var(--line); align-items: baseline; }
  .dbrow:first-child { border-top: 0; }
  .dbrow .name { font-family: var(--font-code); font-weight: 600; overflow-wrap: anywhere; }
  .nums { display: flex; flex-wrap: wrap; gap: 2px 16px; font-size: 14px; }
  .num { min-width: 6.5rem; white-space: nowrap; }
  .num b { display: inline-block; min-width: 2.2rem; text-align: right; font-size: 15px; font-variant-numeric: tabular-nums; }
  .num.zero, .num.zero b { color: var(--muted); font-weight: 400; }
  .res { min-width: 0; word-break: break-word; }
  .res .ok { color: var(--add); font-weight: 600; }
  .res .err { color: var(--del); }
  .res .inc { display: block; font-size: 14px; color: var(--del); }
  .names { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; word-break: break-word; }
  .empty { padding: 28px 16px; text-align: center; color: var(--muted); }

  @media (max-width: 860px) {
    .pair { grid-template-columns: minmax(0, 1fr); }
    .arrow b { display: inline-block; transform: rotate(90deg); margin-right: 8px; }
    .legend { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .dbrow { grid-template-columns: minmax(0, 1fr); }
    .num { min-width: 0; }
    .num b { min-width: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="group">
    <h1>เทียบโครงสร้างฐานข้อมูล: หลายฐาน</h1>
    <div class="pair">
      <div class="db model"><div class="role">ต้นแบบ: server ที่ถูกต้อง (source)</div><div class="name" id="m-source"></div></div>
      <div class="arrow"><b>&rarr;</b>ปรับให้เหมือน</div>
      <div class="db"><div class="role">ปลายทาง: server ที่จะถูกปรับ (target)</div><div class="name" id="m-target"></div></div>
    </div>
    <p class="lead">หน้านี้สรุปผลของฐานข้อมูลชื่อเดียวกันบนสอง server ทีละฐาน กดชื่อฐานเพื่อเปิดรายงานของฐานนั้น</p>
    <div class="note" id="m-options"></div>
    <div class="group" id="warnings"></div>
    <div class="legend" id="legend"></div>
  </header>
  <div class="panel" id="rows"></div>
  <div class="group" id="extra"></div>
</div>
<script>
const INDEX = __INDEX_JSON__;

// The words and the text of a result, kept apart from the page so that a test can run them.
function createIndexCore() {
  'use strict';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  // The same four words as in the report of one database (templates/report.html).
  const KIND = [
    { key: 'onlyInSource', cls: 'add', sym: '+', t: 'ต้องเพิ่ม', d: 'ต้นแบบมี แต่ปลายทางยังไม่มี sync จะสร้างให้' },
    { key: 'onlyInTarget', cls: 'del', sym: '−', t: 'มีเกิน', d: 'ปลายทางมีแต่ต้นแบบไม่มี sync ไม่ลบให้ แค่เขียนคำสั่งลบไว้เป็นหมายเหตุ' },
    { key: 'different', cls: 'chg', sym: '~', t: 'ต้องแก้', d: 'มีทั้งคู่แต่ไม่เหมือนกัน sync จะแก้ปลายทางให้ตรงต้นแบบ ยกเว้นส่วนที่ไฟล์ sync เขียนไว้เป็นหมายเหตุให้ทำเอง' },
    { key: 'unverified', cls: 'unk', sym: '?', t: 'ตรวจไม่ได้', d: 'อ่านค่าไม่ได้ (ไม่มีสิทธิ์ หรือถูกเข้ารหัส) จึงเทียบไม่ได้ และไม่เขียนคำสั่งให้' }
  ];
  const SIDE = { source: 'ต้นแบบ', target: 'ปลายทาง' };
  const sides = list => list.map(s => SIDE[s] || s).join(' และ ');

  // The result of one database as HTML. "ตรงกัน" only when nothing differs, everything could be
  // compared and the login could read everything.
  function resultHtml(row) {
    if (row.error) return `<span class="err">เทียบไม่สำเร็จ: ${esc(row.error)}</span>`;
    const total = row.onlyInSource + row.onlyInTarget + row.different;
    const incomplete = row.incomplete && row.incomplete.length
      ? `<span class="inc">ผลไม่ครบ: ไม่มีสิทธิ์ VIEW DEFINITION ฝั่ง${sides(row.incomplete)}</span>` : '';
    if (total > 0) return `ต่างกัน ${total} รายการ` + incomplete;
    if (incomplete) return 'ไม่พบความต่างในส่วนที่อ่านได้' + incomplete;
    if (row.unverified > 0) return 'ไม่พบความต่างในส่วนที่ตรวจได้';
    return '<span class="ok">ตรงกัน</span>';
  }

  function rowHtml(row) {
    // A long name may break after a dot or an underscore before it breaks anywhere.
    const shown = esc(row.database).replace(/([._])(?=\S)/g, '$1<wbr>');
    const name = row.report && !row.error ? `<a href="${esc(encodeURIComponent(row.report))}">${shown}</a>` : shown;
    const nums = row.error ? '' : KIND.map(k => {
      const n = row[k.key] || 0;
      return `<span class="num ${n ? k.cls : 'zero'}"><b>${n}</b> ${k.t}</span>`;
    }).join('');
    return `<div class="dbrow"><div class="name">${name}</div><div class="nums">${nums}</div><div class="res">${resultHtml(row)}</div></div>`;
  }

  return { esc, KIND, sides, resultHtml, rowHtml };
}

// The page itself. Not run where there is no document (the tests).
if (typeof document !== 'undefined') (function () {
  'use strict';
  const core = createIndexCore();
  const esc = core.esc;
  const $ = id => document.getElementById(id);
  const CAT = {
    'Database': 'ค่าของฐานข้อมูล', 'Schema': 'schema', 'Table': 'ตาราง', 'Column': 'คอลัมน์', 'Index': 'index',
    'Foreign key': 'foreign key', 'Check constraint': 'check constraint', 'View': 'view', 'Stored procedure': 'stored procedure',
    'Function': 'function', 'Trigger': 'trigger', 'User-defined type': 'type ที่สร้างเอง', 'Sequence': 'sequence', 'Synonym': 'synonym'
  };

  $('m-source').textContent = INDEX.source;
  $('m-target').textContent = INDEX.target;
  const o = INDEX.options || {};
  const options = [
    o.ignoreWhitespace ? 'ไม่สนช่องว่าง' : '', o.ignoreCase ? 'ไม่สนตัวพิมพ์เล็ก/ใหญ่' : '',
    o.ignoreCollation ? 'ไม่เทียบ collation' : '', o.compareColumnOrder ? 'เทียบลำดับคอลัมน์ด้วย' : ''
  ].filter(Boolean);
  $('m-options').textContent = 'สร้างเมื่อ ' + INDEX.generated + ' · หมวดที่เทียบ: ' + INDEX.categories.map(c => CAT[c] || c).join(', ') +
    (options.length ? ' · ตัวเลือก: ' + options.join(', ') : '');

  const rows = INDEX.rows;
  const compared = rows.filter(r => !r.error);
  const failed = rows.length - compared.length;
  const incomplete = compared.filter(r => r.incomplete && r.incomplete.length).length;
  let warnings = '';
  if (failed) {
    warnings += `<div class="warn"><b>เทียบไม่สำเร็จ ${failed} จาก ${rows.length} ฐาน</b>` +
      'ตัวเลขด้านล่างนับเฉพาะฐานที่เทียบได้ ฐานที่เทียบไม่สำเร็จไม่มีรายงานและไม่มี script</div>';
  }
  if (incomplete) {
    warnings += `<div class="warn"><b>ผลเทียบไม่ครบ ${incomplete} จาก ${rows.length} ฐาน</b>` +
      'login ไม่มีสิทธิ์ VIEW DEFINITION ในฐานเหล่านั้น: ของที่ login มองไม่เห็นจะขึ้นเป็น "ต้องเพิ่ม" หรือ "มีเกิน" ทั้งที่อาจมีอยู่จริง ' +
      'และโค้ดที่อ่านไม่ได้จะขึ้นเป็น "ตรวจไม่ได้" ให้สิทธิ์ VIEW DEFINITION (หรือ VIEW ANY DEFINITION) แล้วเทียบใหม่เพื่อให้ได้ผลครบ</div>';
  }
  $('warnings').innerHTML = warnings;
  $('warnings').hidden = !warnings;

  $('legend').innerHTML = core.KIND.map(k => {
    const n = compared.reduce((sum, r) => sum + (r[k.key] || 0), 0);
    return `<div class="kind"><span class="top"><span class="n ${k.cls}">${n}</span><span class="t ${k.cls}">${k.sym} ${k.t}</span></span>` +
      `<span class="d">${esc(k.d)}</span></div>`;
  }).join('');

  $('rows').innerHTML = rows.length ? rows.map(core.rowHtml).join('') : '<div class="empty">ไม่มีฐานข้อมูลที่ชื่อตรงกันให้เทียบ</div>';

  let extra = '';
  const list = (title, names) => { if (names && names.length) extra += `<h2>${title}</h2><div class="names">${esc(names.join(', '))}</div>`; };
  list('ฐานที่มีแค่บน server ต้นแบบ', INDEX.onlyOnSource);
  list('ฐานที่มีแค่บน server ปลายทาง', INDEX.onlyOnTarget);
  list('มีทั้งสอง server แต่ login เข้าไม่ได้ (ไม่ได้เทียบ)', (INDEX.noAccess || []).map(d =>
    `${d.database} (เข้าไม่ได้ฝั่ง${core.sides([d.source ? '' : 'source', d.target ? '' : 'target'].filter(Boolean))})`));
  $('extra').innerHTML = extra;
  $('extra').hidden = !extra;
})();
</script>
</body>
</html>
