  @media print, (prefers-contrast: more), (forced-colors: active) {
    body::after, html::after { display: none; }
  }
  a { color: var(--accent); }
  a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 28px 16px 72px; display: grid; gap: 18px; }
  .note { font-size: 14px; color: var(--muted); }
  h1 { font-size: 26px; line-height: 1.3; margin: 0; font-weight: 650; }
  h2 { font-size: 18px; margin: 0; font-weight: 650; }
  .lead { margin: 0; max-width: 75ch; }

  /* The two databases */
  .pair { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); gap: 12px; align-items: stretch; }
  .db { background: var(--fill-reg); border: 1px solid var(--edge-line); border-radius: var(--r-lg, 20px); padding: 12px 18px; min-width: 0; box-shadow: var(--edge), var(--lift); }
  .db.model { border-color: rgba(var(--accent-rgb), .65); }
  .db .role { font-size: 14px; color: var(--muted); }
  .db .name { font-family: var(--font-code); font-size: 16px; font-weight: 650; overflow-wrap: anywhere; }
  .arrow { align-self: center; color: var(--muted); font-size: 14px; text-align: center; line-height: 1.3; }
  .arrow b { display: block; font-size: 24px; color: var(--text); }
  .warn { padding: 12px 16px; border-radius: 18px; background: var(--tint-chg); border: 1px solid var(--warn-line); word-break: break-word; box-shadow: var(--edge); }
  .warn b { display: block; }

  /* The four kinds are tinted glass */
  .legend { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .kind { background: var(--fill-reg); border: 1px solid var(--edge-line); border-radius: 20px; padding: 10px 16px 12px; display: grid; gap: 4px; align-content: start; text-align: left; font: inherit; color: inherit; box-shadow: var(--edge), var(--lift); }
  .kind .top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; }
  .kind .n { font-size: 28px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .kind .t { font-weight: 650; }
  .kind .d { font-size: 14px; color: #c3c6cf; }
  .kind.add, .kind:has(.n.add) { background: var(--tint-add); border-color: var(--line-add); }
  .kind.del, .kind:has(.n.del) { background: var(--tint-del); border-color: var(--line-del); }
  .kind.chg, .kind:has(.n.chg) { background: var(--tint-chg); border-color: var(--line-chg); }
  .kind.unk, .kind:has(.n.unk) { background: var(--tint-unk); }
  .kind.add .n, .kind.add .t { color: var(--add); }
  .kind.del .n, .kind.del .t { color: var(--del); }
  .kind.chg .n, .kind.chg .t { color: var(--chg); }
  .kind.unk .n, .kind.unk .t { color: var(--unk); }

  .panel { background: var(--fill-reg); border: 1px solid var(--edge-line); border-radius: 24px; min-width: 0; box-shadow: var(--edge), var(--lift); }
  .empty { padding: 28px 16px; text-align: center; color: var(--muted); }

  /* Nothing of the screen is printed: a light page with dark text, and no glass. */
  @media print {
    :root {
      color-scheme: light; --text: #111; --muted: #444; --line: #bbb; --edge-line: #bbb; --head: #eee; --accent: #1d4fc0;
      --add: #116b2f; --add-bg: #e3f3e8; --del: #a8261c; --del-bg: #fbe9e7; --chg: #7a5200; --chg-bg: #fdf1d3; --unk: #444; --unk-bg: #eee;
      --warn-line: #c9a227; --err-bg: #fbe9e7; --code-bg: #f7f7f7; --add-row: #d7efde; --del-row: #f6d9d5;
      --tint-add: #e3f3e8; --tint-del: #fbe9e7; --tint-chg: #fdf1d3; --tint-unk: #eee;
      --line-add: #7bbf8e; --line-del: #d98d86; --line-chg: #d6b25c;
      --fill-clear: #fff; --fill-reg: #fff; --fill-inset: #f4f4f4; --edge: none; --lift: none; --blur: none;
    }
    body { background: #fff; }
    body::before { display: none; }
  }

  /* One centred column: a header names both databases and explains the four words, then one
     card per table with everything of that table, then the code and the rest. The file is
     opened offline, so it uses system fonts only. */
  /* Single-column grids: wide code stays inside its own scroll box instead of widening the page. */
  .wrap, .group, .rows, .tables, .tcard, .body, .changes, .kids { grid-template-columns: minmax(0, 1fr); }
  .group { display: grid; gap: 10px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  button:focus-visible, input:focus-visible, select:focus-visible, summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* The legend that also filters */
  .kind { cursor: pointer; }
  .kind:hover { border-color: rgba(var(--accent-rgb), .85); }
  .kind.on { outline: 2px solid rgb(var(--accent-rgb)); outline-offset: 2px; }

  .chip { display: inline-flex; align-items: center; gap: 4px; padding: 1px 11px; border-radius: 999px; font-size: 14px; font-weight: 650; white-space: nowrap; }
  .chip.add, .sym.add { color: var(--add); background: var(--add-bg); }
  .chip.del, .sym.del { color: var(--del); background: var(--del-bg); }
  .chip.chg, .sym.chg { color: var(--chg); background: var(--chg-bg); }
  .chip.unk, .sym.unk { color: var(--unk); background: var(--unk-bg); }

  /* The search and the filter float over the cards while the page scrolls under them: the one place
     in this file where the blur is real. */
  .toolbar { position: sticky; top: 12px; z-index: 3; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 7px 10px;
    background: var(--fill-clear); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    border: 1px solid var(--edge-line); border-radius: 999px; box-shadow: var(--edge), var(--lift); }
  .toolbar input, .toolbar select { font: inherit; color: var(--text); background: var(--fill-inset); border: 1px solid var(--edge-line); border-radius: 999px; padding: 6px 16px; min-width: 0; max-width: 100%; box-shadow: inset 0 1px 3px rgba(0, 0, 0, .45); }
  .toolbar input { flex: 1 1 240px; }
  .toolbar input::placeholder { color: #8b8e98; }
  .toolbar select option { background: #171b26; color: var(--text); }
  .toolbar .count { color: var(--muted); font-size: 14px; margin: 0 8px; }
  .linkbtn { justify-self: start; font: inherit; font-size: 14px; color: var(--accent); background: var(--fill-clear); border: 1px solid var(--edge-line); border-radius: 999px; padding: 3px 14px; cursor: pointer; box-shadow: var(--edge); }
  .linkbtn:hover { border-color: rgba(var(--accent-rgb), .85); }
  .group-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 8px; margin-top: 8px; }

  /* One card per table */
  .tables { display: grid; gap: 14px; }
  .tcard { display: grid; overflow: hidden; }
  .tcard-h { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding: 13px 18px; background: rgba(255, 255, 255, .07); }
  .tcard-h .obj { font-family: var(--font-code); font-size: 16px; font-weight: 650; overflow-wrap: anywhere; }
  .tcard-h .note { margin-left: auto; }
  .titem { display: grid; grid-template-columns: 1.6rem 13rem minmax(0, 1fr); gap: 4px 12px; padding: 11px 18px; border-top: 1px solid rgba(255, 255, 255, .09); align-items: baseline; }
  .sym { font-family: var(--font-code); font-weight: 700; text-align: center; border-radius: 7px; }
  .what { font-size: 14px; color: var(--muted); min-width: 0; }
  .what b { display: block; color: var(--text); font-family: var(--font-code); font-weight: 650; overflow-wrap: anywhere; }
  .body { min-width: 0; display: grid; gap: 4px; }
  .say { font-size: 14px; color: var(--muted); }
  .say b { color: var(--text); font-weight: 650; }
  .hint { font-size: 14px; border-left: 3px solid var(--warn-line); padding-left: 10px; }

  /* What changed: the value now, struck through, then the value it becomes */
  .changes { display: grid; gap: 4px; }
  .ch { display: grid; grid-template-columns: 11rem minmax(0, 1fr); gap: 10px; align-items: baseline; font-size: 14px; }
  .ch .p { color: var(--muted); }
  .ft { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px; min-width: 0; }
  .ft .from { text-decoration: line-through; text-decoration-color: var(--del); color: var(--muted); font-family: var(--font-code); overflow-wrap: anywhere; white-space: pre-wrap; }
  .ft .to { font-family: var(--font-code); font-weight: 650; overflow-wrap: anywhere; white-space: pre-wrap; }
  .ft .arr { color: var(--muted); }
  .facts { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 14px; color: var(--muted); }
  .facts span { min-width: 0; }
  .facts b { color: var(--text); font-weight: 650; font-family: var(--font-code); overflow-wrap: anywhere; white-space: pre-wrap; }
  .rawline { font-family: var(--font-code); font-size: 14px; word-break: break-word; white-space: pre-wrap; }

  /* The code and the rest */
  .rows { display: grid; }
  .row { display: grid; grid-template-columns: 9.5rem minmax(0, 1fr); gap: 4px 14px; padding: 13px 18px; border-top: 1px solid rgba(255, 255, 255, .09); }
  .row:first-child { border-top: 0; }
  .row .obj { font-family: var(--font-code); font-size: 15px; font-weight: 650; overflow-wrap: anywhere; }
  .row .obj .note { font-family: var(--font-body); font-weight: 400; }
  .kids { display: grid; margin-top: 6px; background: var(--fill-inset); border: 1px solid rgba(255, 255, 255, .09); border-radius: 16px; box-shadow: inset 0 1px 3px rgba(0, 0, 0, .35); }
  .kids .titem:first-child { border-top: 0; }
  .kids .titem { padding: 9px 14px; }

  /* Code and line diffs: an inset box, and the only boxes that scroll sideways */
  .codebox { min-width: 0; }
  .code { overflow: auto; max-height: 70vh; background: var(--code-bg); border: 1px solid rgba(255, 255, 255, .10); border-radius: 16px; box-shadow: inset 0 1px 3px rgba(0, 0, 0, .5); }
  .code table { border-collapse: collapse; width: 100%; font: 14px/1.55 var(--font-code); }
  .code td { padding: 0 10px; white-space: pre; vertical-align: top; }
  .code td.ln { width: 1%; color: #7b7e89; text-align: right; user-select: none; padding-right: 4px; }
  .code td.sig { width: 1%; color: var(--muted); padding: 0 4px; user-select: none; }
  .code tr.del td { background: var(--del-row); }
  .code tr.add td { background: var(--add-row); }
  .code tr.del td.sig { color: var(--del); }
  .code tr.add td.sig { color: var(--add); }
  .code tr.gap td { background: rgba(255, 255, 255, .06); color: var(--muted); font: 14px/1.6 var(--font-body); padding: 2px 10px; }
  .cap { display: flex; flex-wrap: wrap; gap: 2px 16px; padding: 7px 12px; font: 14px/1.5 var(--font-body); color: var(--muted); border-bottom: 1px solid rgba(255, 255, 255, .09); position: sticky; left: 0; }
  .cap .m { font-weight: 650; }
  .cap .m.del { color: var(--del); }
  .cap .m.add { color: var(--add); }

  /* Choosing the rows of a script. Only where the app serves the report (see selectionTarget): the
     boxes, the bar at the bottom and its messages. In this mode every row gets a column for its box. */
  input.pick, input.pickg { width: 20px; height: 20px; margin: 2px; accent-color: rgb(var(--accent-rgb)); cursor: pointer; }
  .pickg-l { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--muted); cursor: pointer; }
  .selecting .titem { grid-template-columns: 1.6rem 1.6rem 13rem minmax(0, 1fr); }
  .selecting .row { grid-template-columns: 1.6rem 9.5rem minmax(0, 1fr); }
  .linkbtn.primary { color: #fff; font-weight: 650; background: linear-gradient(180deg, rgba(var(--accent-rgb), .86), rgba(var(--accent-rgb), .54)); border-color: rgba(var(--accent-rgb), .7); }
  .linkbtn:disabled { opacity: .55; cursor: not-allowed; }
  .pickdock { position: fixed; left: 50%; bottom: 14px; transform: translateX(-50%); z-index: 6; width: min(940px, calc(100% - 24px)); display: grid; gap: 8px; justify-items: center; }
  .pickbar { display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 12px; padding: 8px 14px; max-width: 100%;
    background: var(--fill-clear); -webkit-backdrop-filter: var(--blur); backdrop-filter: var(--blur);
    border: 1px solid var(--edge-line); border-radius: 999px; box-shadow: var(--edge), var(--lift); }
  .pickbar .count { font-size: 14px; }
  .pickgrp { display: inline-flex; align-items: center; gap: 6px; padding: 3px 4px 3px 14px; border-radius: 999px; background: rgba(255, 255, 255, .07); }
  .pickmsg { width: 100%; padding: 12px 16px; border-radius: 18px; border: 1px solid var(--edge-line); background: var(--fill-reg); box-shadow: var(--edge), var(--lift); font-size: 14px; }
  .pickmsg.need { background: var(--tint-chg); border-color: var(--warn-line); }
  .pickmsg.bad { background: var(--tint-del); border-color: var(--line-del); }
  .pickmsg.ok { background: var(--tint-add); border-color: var(--line-add); }
  .pickmsg ul { margin: 6px 0 10px 18px; padding: 0; }
  .pickmsg .acts { display: flex; flex-wrap: wrap; gap: 8px; }

  details.totals { font-size: 14px; color: var(--muted); }
  details.totals summary { cursor: pointer; }
  details.totals table { border-collapse: collapse; margin-top: 8px; font-variant-numeric: tabular-nums; }
  details.totals th, details.totals td { padding: 3px 14px 3px 0; text-align: right; font-weight: 400; }
  details.totals th:first-child, details.totals td:first-child { text-align: left; }
  details.totals thead th { font-weight: 650; color: var(--text); }

  @media (max-width: 720px) {
    .pair { grid-template-columns: minmax(0, 1fr); }
    .arrow b { display: inline-block; transform: rotate(90deg); margin-right: 8px; }
    .legend { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .row { grid-template-columns: minmax(0, 1fr); }
    .ch { grid-template-columns: minmax(0, 1fr); gap: 0; }
    .titem { grid-template-columns: 1.6rem minmax(0, 1fr); }
    .titem .body { grid-column: 2; }
    .tcard-h .note { margin-left: 0; }
    /* Two rows of controls would cover too much of a small screen. */
    .toolbar { position: static; border-radius: 24px; }
    .selecting .titem { grid-template-columns: 1.6rem 1.6rem minmax(0, 1fr); }
    .selecting .titem .body { grid-column: 3; }
    .selecting .row { grid-template-columns: 1.6rem minmax(0, 1fr); }
    .selecting .row > .body { grid-column: 2; }
    .pickbar { border-radius: 24px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .kind, .linkbtn { transition: border-color .15s; }
  }
  @media print {
    .toolbar { display: none; }
    .pickdock, input.pick, input.pickg, .pickg-l { display: none; }
    .panel, .db, .kind { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="group">

    <div class="pair">
      <div class="db" id="card-source"><div class="role" id="role-source"></div><div class="name" id="m-source"></div></div>
      <div class="arrow"><b>&rarr;</b><span id="arrow-text"></span></div>
      <div class="db"><div class="role" id="role-target"></div><div class="name" id="m-target"></div></div>
    </div>
    <p class="lead" id="lead"></p>
    <div class="note" id="m-options"></div>
    <div class="group" id="warnings"></div>
    <div class="legend" id="legend"></div>
  </header>
  <div class="toolbar">
    <input id="q" type="search" placeholder="ค้นชื่อ เช่น Orders หรือ pGetOrder" aria-label="ค้นหา">
    <select id="f-cat" aria-label="ชนิดของ"></select>

</div>
<div class="pickdock" id="pickdock" hidden>
  <div class="pickmsg" id="pick-msg" role="status" hidden></div>
  <div class="pickbar">
    <span class="count" id="pick-count"></span>
    <button class="linkbtn" id="pick-clear">ล้างที่เลือก</button>
    <span class="pickgrp"><span class="note">sync script</span>
      <button class="linkbtn" id="pick-view-sync" title="เปิดแท็บใหม่ให้อ่านและคัดลอกได้เลย">ดู</button>
      <button class="linkbtn primary" id="pick-sync">ดาวน์โหลด</button></span>
    <span class="pickgrp"><span class="note">rollback script</span>
      <button class="linkbtn" id="pick-view-rollback" title="เปิดแท็บใหม่ให้อ่านและคัดลอกได้เลย">ดู</button>
      <button class="linkbtn" id="pick-rollback">ดาวน์โหลด</button></span>
  </div>
</div>
<script>
const META = __META_JSON__;
const DATA = __DATA_JSON__;

// Everything that does not touch the page: the words, the parsing of the engine's detail text, the
// grouping by table and the line diff. test/report.test.ts runs this part without a browser.
function createReportCore(meta) {
  'use strict';
  // sync (default): read as changes to the target, which becomes like the source model, so "only
  // in source" is something to add (green) and "only in target" something that is extra (red).
  // timeline (drift): read from the older source to the later target, the other way round.
  const TIMELINE = meta.perspective === 'timeline';
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

  const SIDE = TIMELINE
    ? { source: 'จุด "ก่อน"', target: 'จุด "หลัง"', both: 'ทั้งสองจุด' }
    : { source: 'ฝั่งต้นแบบ', target: 'ฝั่งปลายทาง', both: 'ทั้งสองฝั่ง' };

  const UNREADABLE = 'อ่านค่าไม่ได้ (ไม่มีสิทธิ์ หรือถูกเข้ารหัส)';
  const KIND = TIMELINE ? {
    OnlyInSource: { cls: 'del', sym: '−', t: 'หายไป', d: 'เคยมีในจุด "ก่อน" แต่จุด "หลัง" ไม่มีแล้ว' },
    OnlyInTarget: { cls: 'add', sym: '+', t: 'เพิ่มขึ้นมา', d: 'จุด "ก่อน" ยังไม่มี เพิ่งมีในจุด "หลัง"' },
    Different: { cls: 'chg', sym: '~', t: 'ถูกแก้', d: 'มีทั้งสองจุด แต่ไม่เหมือนเดิม' },
    Unverified: { cls: 'unk', sym: '?', t: 'ตรวจไม่ได้', d: UNREADABLE + ' จึงบอกไม่ได้ว่าเปลี่ยนหรือไม่' }
  } : {
    OnlyInSource: { cls: 'add', sym: '+', t: 'ต้องเพิ่ม', d: 'ต้นแบบมี แต่ปลายทางยังไม่มี sync จะสร้างให้ ยกเว้นส่วนที่ไฟล์ sync เขียนไว้เป็นหมายเหตุให้ทำเอง' },
    OnlyInTarget: { cls: 'del', sym: '−', t: 'มีเกิน', d: 'ปลายทางมีแต่ต้นแบบไม่มี sync ไม่ลบให้ แค่เขียนคำสั่งลบไว้เป็นหมายเหตุ' },
    Different: { cls: 'chg', sym: '~', t: 'ต้องแก้', d: 'มีทั้งคู่แต่ไม่เหมือนกัน sync จะแก้ปลายทางให้ตรงต้นแบบ ยกเว้นส่วนที่ไฟล์ sync เขียนไว้เป็นหมายเหตุให้ทำเอง' },
    Unverified: { cls: 'unk', sym: '?', t: 'ตรวจไม่ได้', d: UNREADABLE + ' จึงเทียบไม่ได้ และไม่เขียนคำสั่งให้' }
  };

  const CAT = {
    'Database': 'ค่าของฐานข้อมูล', 'Schema': 'schema', 'Table': 'ตาราง', 'Column': 'คอลัมน์', 'Index': 'index',
    'Foreign key': 'foreign key', 'Check constraint': 'check constraint', 'View': 'view', 'Stored procedure': 'stored procedure',
    'Function': 'function', 'Trigger': 'trigger', 'User-defined type': 'type ที่สร้างเอง', 'Sequence': 'sequence', 'Synonym': 'synonym'
  };
  const cat = c => CAT[c] || c;
  // A category inside a Thai sentence: a Latin word needs a space on each side, a Thai one none.
  const catWord = c => (/^[A-Za-z]/.test(cat(c)) ? ' ' + cat(c) + ' ' : cat(c));

  // The properties the engine compares, per category, in the order it writes them.
  const MODULE_PROPS = ['Type', 'Table', 'State', 'SetOptions'];
  const PROPS = {
    'Database': ['CompatibilityLevel', 'Collation'],
    'Column': ['Type', 'Nullable', 'Identity', 'Computed', 'Persisted', 'Default', 'Collation', 'Ordinal'],
    'Index': ['Kind', 'Type', 'Columns', 'Include', 'Filter', 'Name'],
    'Foreign key': ['Columns', 'References', 'OnDelete', 'OnUpdate', 'State'],
    'Check constraint': ['Expression', 'State'],
    'View': MODULE_PROPS, 'Stored procedure': MODULE_PROPS, 'Function': MODULE_PROPS, 'Trigger': MODULE_PROPS,
    'User-defined type': ['Kind', 'Spec', 'Details', 'Collation'],
    'Sequence': ['DataType', 'Precision', 'Start', 'Increment', 'Min', 'Max', 'Cycle', 'Cache'],
    'Synonym': ['BaseObject']
  };
  const MODULES = ['View', 'Stored procedure', 'Function', 'Trigger'];
  const TABLE_CHILDREN = ['Column', 'Index', 'Foreign key', 'Check constraint'];

  const LABEL = {
    Type: 'ชนิดข้อมูล', DataType: 'ชนิดข้อมูล', Nullable: 'ยอมให้ว่าง (NULL)', Identity: 'เลขรันอัตโนมัติ (IDENTITY)',
    Computed: 'สูตรคำนวณ', Persisted: 'เก็บค่าที่คำนวณไว้', Default: 'ค่าเริ่มต้น', Collation: 'collation', Ordinal: 'ลำดับคอลัมน์',
    Kind: 'ประเภท', Columns: 'คอลัมน์', Include: 'คอลัมน์ที่แนบ (INCLUDE)', Filter: 'เงื่อนไขกรอง (WHERE)', Name: 'ชื่อ',
    References: 'อ้างถึง', OnDelete: 'เมื่อลบแถวแม่', OnUpdate: 'เมื่อแก้แถวแม่', State: 'สถานะ', Expression: 'เงื่อนไข',
    Table: 'อยู่บน', SetOptions: 'ค่า SET ตอนสร้าง', Definition: 'โค้ด', Spec: 'โครงสร้าง', Details: 'รายละเอียดเพิ่ม',
    Precision: 'จำนวนหลัก (precision)', Start: 'เริ่มที่', Increment: 'เพิ่มทีละ', Min: 'ต่ำสุด', Max: 'สูงสุด', Cycle: 'วนรอบ',
    Cache: 'cache', BaseObject: 'ชี้ไปที่', CompatibilityLevel: 'compatibility level'
  };
  const OBJECT_TYPE = { Type: 'ประเภท object' };
  const LABEL_BY_CAT = {
    'Index': { Type: 'แบบ index' },
    'View': OBJECT_TYPE, 'Stored procedure': OBJECT_TYPE, 'Function': OBJECT_TYPE, 'Trigger': OBJECT_TYPE,
    'User-defined type': { Collation: 'collation ของคอลัมน์', Details: 'รายละเอียดเพิ่ม (IDENTITY, default, key, check)' },
    'Database': { Collation: 'collation ของฐาน' }
  };
  const propLabel = (category, key) => (LABEL_BY_CAT[category] && LABEL_BY_CAT[category][key]) || LABEL[key] || key;

  const VALUE = {
    Nullable: { 'NULL': 'ได้ (NULL)', 'NOT NULL': 'ไม่ได้ (NOT NULL)' },
    State: { 'ENABLED': 'เปิดใช้', 'DISABLED': 'ปิดอยู่' },
    Persisted: { 'PERSISTED': 'เก็บไว้ (PERSISTED)', '(none)': 'ไม่เก็บ' },
    SetOptions: { '(none)': 'ปกติ (ON)' },
    Cycle: { 'CYCLE': 'วน (CYCLE)', 'NO CYCLE': 'ไม่วน (NO CYCLE)' },
    Cache: { 'NO CACHE': 'ไม่ใช้ (NO CACHE)' },
    OnDelete: { 'NO_ACTION': 'ไม่ทำอะไร (NO ACTION)', 'CASCADE': 'ทำตามแถวแม่ (CASCADE)', 'SET_NULL': 'ใส่ NULL (SET NULL)', 'SET_DEFAULT': 'ใส่ค่าเริ่มต้น (SET DEFAULT)' },
    Name: { '(system-named)': 'ระบบตั้งชื่อให้' },
    Kind: { 'alias type': 'type ย่อ (alias)', 'table type': 'type แบบตาราง' },
    Table: { 'DATABASE': 'ทั้งฐานข้อมูล (database trigger)' }
  };
  VALUE.OnUpdate = VALUE.OnDelete;
  // A value as the engine writes it, in plain words. "(none)" is its word for an empty value.
  function val(key, v) {
    if (v === '(not readable)') return 'อ่านไม่ได้';
    const known = VALUE[key];
    if (known && Object.prototype.hasOwnProperty.call(known, v)) return known[v];
    return v === '(none)' ? 'ไม่มี' : v;
  }

  // The text the engine writes where a definition exists but cannot be read ($HiddenDefinition).
  const HIDDEN_DEFINITION = '-- definition not available (encrypted, CLR, or no VIEW DEFINITION permission)';

  function toRows(data) {
    return data.map((r, i) => ({
      id: i, cat: r[0], obj: r[1], status: r[2], detail: r[3] || '', a: r[4], b: r[5],
      group: r[6] ? { kind: r[6][0], key: r[6][1] } : null
    }));
  }

  const ENTRY_START = /^[A-Za-z]+: (?:source |not readable on )/;
  const NOT_READABLE = /^([A-Za-z]+): not readable on (source|target|either side)( \(not compared\))?$/;

  // The detail of a row that is on one side only, "Prop: value; Prop: value", as the engine
  // wrote it: one { key, value } per property (key '' for a part without a property name).
  function factPairs(row) {
    const names = PROPS[row.cat];
    const splitter = names ? new RegExp('; (?=(?:' + names.join('|') + '): )') : /; (?=[A-Z][A-Za-z]*: )/;
    return (row.detail || '').split(splitter).map(part => {
      const at = part.indexOf(': ');
      return at < 1 ? { key: '', value: part } : { key: part.slice(0, at), value: part.slice(at + 2) };
    });
  }

  // What the engine's detail text says, as data.
  // - "only in" rows: "Prop: value; Prop: value" -> facts.
  // - different rows: one line per property, "Prop: source A, target B" -> changes, shown as
  //   from (what is there now) -> to (what it becomes). "Definition differs" -> code.
  // - "Prop: not readable on source" -> notes.
  // A line that cannot be read with certainty (a value that holds ", target " itself) goes to
  // raw and is shown as the engine wrote it: never a guess at which value is whose.
  function parseDetail(row) {
    const out = { code: false, changes: [], facts: [], notes: [], raw: [] };
    const detail = row.detail || '';
    if (!detail) return out;
    if (row.status === 'OnlyInSource' || row.status === 'OnlyInTarget') {
      factPairs(row).forEach(f => {
        if (!f.key) { out.raw.push(f.value); return; }
        out.facts.push({ key: f.key, label: propLabel(row.cat, f.key), value: val(f.key, f.value) });
      });
      return out;
    }
    // One entry per line, but a value (a default, a check) can hold line breaks itself.
    const entries = [];
    detail.split('\n').forEach(line => {
      if (!entries.length || line === 'Definition differs' || ENTRY_START.test(line)) entries.push(line);
      else entries[entries.length - 1] += '\n' + line;
    });
    entries.forEach(text => {
      if (text === 'Definition differs') { out.code = true; return; }
      const hidden = NOT_READABLE.exec(text);
      if (hidden) {
        const side = hidden[2] === 'either side' ? SIDE.both : SIDE[hidden[2]];
        out.notes.push({ key: hidden[1], side: hidden[2], text: propLabel(row.cat, hidden[1]) + ': อ่านไม่ได้ใน' + side + (hidden[3] ? ' จึงไม่ได้เทียบส่วนนี้' : '') });
        return;
      }
      const m = /^([A-Za-z]+): source ([\s\S]*)$/.exec(text);
      const sides = m ? m[2].split(', target ') : [];
      if (sides.length !== 2) { out.raw.push(text); return; }
      const source = val(m[1], sides[0]), target = val(m[1], sides[1]);
      out.changes.push({ key: m[1], label: propLabel(row.cat, m[1]), from: TIMELINE ? source : target, to: TIMELINE ? target : source });
    });
    return out;
  }

  // The name of a column, index or constraint inside its table's card: the object name without
  // the table. The engine writes "<table>.<name>", or "<table> (primary key)", "<table> (unique:
  // columns)", "<table> (foreign key: ...)", "<table> (check: ...)" for one without a name of
  // its own. The table is known from the group key, so nothing is guessed from the dots.
  function leafOf(row) {
    const g = row.group;
    if (!g || TABLE_CHILDREN.indexOf(row.cat) < 0 || row.obj.slice(0, g.key.length) !== g.key) return { name: row.obj, kind: cat(row.cat), pk: false };
    const rest = row.obj.slice(g.key.length);
    if (rest.charAt(0) === '.') return { name: rest.slice(1), kind: cat(row.cat), pk: false };
    const m = /^ \((primary key|unique: |foreign key: |check: )([\s\S]*)\)$/.exec(rest);
    if (!m) return { name: row.obj, kind: cat(row.cat), pk: false };
    if (m[1] === 'primary key') return { name: 'ของตารางนี้', kind: 'primary key', pk: true };
    const kind = m[1] === 'unique: ' ? 'unique' : m[1] === 'check: ' ? 'check constraint' : 'foreign key';
    return { name: 'ไม่มีชื่อ: ' + m[2], kind, pk: false };
  }

  // True when the sync script writes the view of this row again (CREATE OR ALTER VIEW), which
  // drops every index the view has. The same test as the engine's.
  function viewIsRewritten(self) {
    return Boolean(self) && self.status === 'Different' && /(^|\n)(Definition differs|SetOptions:)/.test(self.detail) &&
      !/(^|\n)(Type:|Definition: not readable)/.test(self.detail);
  }

  // The target was read by a login without VIEW DEFINITION. What reads as "only in source" may
  // then be there, hidden, and the sync script writes some of it as comments to run by hand
  // (the INCOMPLETE COMPARISON lines at the top of a sync script say which).
  const TARGET_INCOMPLETE = (meta.noViewDefinition || []).some(w => w[0] === 'target');

  // How many parts an object name has: dots outside [brackets] and "quotes" (Get-NamePartCount
  // of the engine). A synonym for a name of 3 or 4 parts points into another database or to
  // another server, and the sync script writes that one as a comment.
  function namePartCount(name) {
    let parts = 1;
    for (let i = 0; i < name.length; i++) {
      const ch = name.charAt(i);
      if (ch === '[' || ch === '"') {
        const close = ch === '[' ? ']' : '"';
        for (i++; i < name.length; i++) {
          if (name.charAt(i) !== close) continue;
          if (name.charAt(i + 1) === close) i++; else break;
        }
      } else if (ch === '.') parts++;
    }
    return parts;
  }

  // The kinds of index the sync script can write a CREATE for (Get-CreateIndexSql of the engine).
  const PLAIN_INDEX = ['CLUSTERED', 'NONCLUSTERED'];
  const NOT_READABLE_VALUE = '(not readable)';

  // One line on what happens to this row. ctx.self: the row of the table or view it belongs to.
  //
  // It says "sync will" only where the sync script writes a statement. Where the script writes
  // a comment for a person to run, it says so: "เป็นหมายเหตุให้ทำเอง". A row holds what differs
  // and no more (a changed column does not say whether it is computed, a changed index not what
  // kind it is), so where the script's choice hangs on something the row does not show, the
  // line says "sync will, unless ...". test/report.test.ts holds every real report to that,
  // against the sync script of the same comparison.
  function sentence(row, parsed, ctx) {
    const self = ctx && ctx.self;
    const NOTE = 'เขียนเป็นหมายเหตุให้ทำเอง';
    if (TIMELINE) {
      if (row.status === 'OnlyInSource') return 'เคยมีในจุด "ก่อน" แต่จุด "หลัง" ไม่มีแล้ว';
      if (row.status === 'OnlyInTarget') return 'จุด "ก่อน" ยังไม่มี เพิ่งมีในจุด "หลัง"';
      if (row.status === 'Unverified') return 'อ่านค่าไม่ได้ จึงบอกไม่ได้ว่าเปลี่ยนหรือไม่';
      return parsed.code ? 'โค้ดข้างในถูกแก้' + (parsed.changes.length ? ' และค่าด้านล่างเปลี่ยนจากที่ขีดฆ่าเป็นค่าใหม่' : '') : 'เปลี่ยนจากค่าที่ขีดฆ่าเป็นค่าใหม่';
    }
    if (row.status === 'Unverified') return 'อ่านค่าไม่ได้ จึงเทียบไม่ได้ และ sync ไม่เขียนคำสั่งให้';
    if (row.status === 'OnlyInSource') {
      const facts = factPairs(row);
      const fact = key => { const f = facts.filter(p => p.key === key)[0]; return f ? f.value : ''; };
      const missing = 'ปลายทางยังไม่มี' + catWord(row.cat) + 'นี้';
      if (row.cat === 'Table') {
        const children = ['Index', 'Check constraint', 'Foreign key'];
        const compared = c => (meta.categories || []).indexOf(c) >= 0;
        const skipped = children.filter(c => !compared(c)).map(cat);
        const notCompared = skipped.length ? ' (ไม่รวม ' + skipped.join(', ') + ' เพราะไม่ได้เลือกเทียบหมวดนั้น)' : '';
        const table = 'ปลายทางยังไม่มีตารางนี้ sync จะสร้างทั้งตาราง พร้อมคอลัมน์และ primary key';
        // The table may be there, hidden: its CREATE TABLE then fails, and what stands on it
        // would land on the table that is there. Those statements wait as comments.
        if (TARGET_INCOMPLETE) {
          const waiting = children.filter(compared).map(cat);
          return table + (waiting.length ? ' ส่วน ' + waiting.join(', ') + ' ของมัน sync ' + NOTE + ' หลังเช็คว่าตารางถูกสร้างจริง (ผลเทียบไม่ครบ ตารางนี้อาจมีอยู่แล้วแต่มองไม่เห็น)' : '') + notCompared;
        }
        return table + (notCompared || ' รวมทั้ง index, check และ foreign key ของมัน');
      }
      if (row.cat === 'Synonym') {
        if (namePartCount(fact('BaseObject')) >= 3) return 'synonym นี้ชี้ไปฐานอื่นหรือ server อื่น ซึ่งชื่อมักต่างกันในแต่ละที่ sync จึงเขียนคำสั่งสร้างไว้เป็นหมายเหตุให้ตรวจแล้วทำเอง';
        return missing + ' sync จะสร้างให้';
      }
      // A module whose text cannot be read in the source cannot be written for the target.
      if (MODULES.indexOf(row.cat) >= 0 && row.a === HIDDEN_DEFINITION) {
        return missing + ' แต่โค้ดของต้นแบบอ่านไม่ได้ sync จึงสร้างให้ไม่ได้ มีแต่หมายเหตุ';
      }
      // Nor a column, an index or a check of which the part that defines it cannot be read. For
      // a computed column that part is its formula alone: the script adds it as "name AS
      // formula" and writes no type (Get-ColumnDefinition of the engine), so a type that could
      // not be read is not in the way. For any other column it is the type.
      const formula = fact('Computed');
      if (row.cat === 'Column' && (formula ? formula === NOT_READABLE_VALUE : fact('Type') === NOT_READABLE_VALUE)) {
        return missing + (formula ? ' แต่สูตรคำนวณของต้นแบบอ่านไม่ได้' : ' แต่ชนิดข้อมูลของต้นแบบอ่านไม่ได้') + ' sync จึงสร้างให้ไม่ได้ มีแต่หมายเหตุ';
      }
      if (row.cat === 'Index' && fact('Type') && PLAIN_INDEX.indexOf(fact('Type')) < 0) {
        return missing + ' แต่ index แบบ ' + fact('Type') + ' sync เขียนคำสั่งสร้างไม่ได้ มีแต่หมายเหตุให้ทำเอง';
      }
      if (row.cat === 'Index' && fact('Filter') === NOT_READABLE_VALUE) return missing + ' แต่เงื่อนไขกรองของต้นแบบอ่านไม่ได้ sync จึงสร้างให้ไม่ได้ มีแต่หมายเหตุ';
      if (row.cat === 'Check constraint' && fact('Expression') === NOT_READABLE_VALUE) return missing + ' แต่เงื่อนไขของต้นแบบอ่านไม่ได้ sync จึงสร้างให้ไม่ได้ มีแต่หมายเหตุ';
      if (TARGET_INCOMPLETE) {
        // A check without a name is paired by its text, which that login cannot read.
        if (row.cat === 'Check constraint' && leafOf(row).name.indexOf('ไม่มีชื่อ: ') === 0) {
          return 'check นี้ไม่มีชื่อ และ check ที่ไม่มีชื่อของปลายทางอ่านไม่ได้ จึงไม่รู้ว่ามีอยู่แล้วหรือยัง sync จึงเขียนคำสั่งสร้างไว้เป็นหมายเหตุให้ทำเอง';
        }
        // The index of a view that is new itself waits for its CREATE VIEW.
        if (row.cat === 'Index' && row.group && row.group.kind === 'view' && self && self.status === 'OnlyInSource') {
          return missing + ' sync ' + NOTE + ' หลังเช็คว่า view ถูกสร้างจริง (ผลเทียบไม่ครบ view นี้อาจมีอยู่แล้วแต่มองไม่เห็น)';
        }
        if (MODULES.indexOf(row.cat) >= 0) return missing + ' sync จะสร้างด้วย CREATE ธรรมดา ถ้ามีอยู่แล้วแต่มองไม่เห็น คำสั่งจะ fail โดยไม่เขียนทับ';
      }
      return missing + ' sync จะสร้างให้';
    }
    if (row.status === 'OnlyInTarget') {
      if (row.cat === 'Index' && row.group && row.group.kind === 'view' && viewIsRewritten(self)) {
        return 'มีแค่ในปลายทาง แต่ sync จะเขียน view นี้ใหม่ ซึ่งทำให้ index นี้หายไปด้วย (rollback script สร้างคืนให้)';
      }
      return 'มีแค่ในปลายทาง sync ไม่ลบให้ แค่เขียนคำสั่งลบไว้เป็นหมายเหตุ';
    }
    // Different: what the sync script does depends on what differs.
    const keys = parsed.changes.map(c => c.key);
    const has = key => keys.indexOf(key) >= 0;
    const only = key => !parsed.code && keys.length > 0 && keys.every(k => k === key);
    const change = key => parsed.changes.filter(c => c.key === key)[0];
    // A line of the detail that could not be split still starts with the name of its property.
    const mayDiffer = key => has(key) || parsed.raw.some(text => text.indexOf(key + ': ') === 0);
    const BY_HAND = ' sync เขียนคำสั่งไว้เป็นหมายเหตุให้ทำเอง';
    const UNLESS = conditions => ' (ถ้า' + conditions.join(' หรือ') + ' sync จะ' + NOTE + 'แทน)';
    if (row.cat === 'Database') return 'sync ไม่แก้ค่าของฐานข้อมูลให้ แค่เขียนไว้เป็นหมายเหตุ';
    if (row.cat === 'User-defined type') return 'type แก้ตรงๆ ไม่ได้ ต้องลบแล้วสร้างใหม่' + BY_HAND;
    if (row.cat === 'Sequence') return 'sync จะแก้ให้ตรงต้นแบบ ยกเว้นชนิดข้อมูลและค่าเริ่มที่ ซึ่งแก้ไม่ได้';
    if (row.cat === 'Synonym') {
      const base = change('BaseObject');
      if (!base) return 'sync จะลบแล้วสร้างใหม่ให้ชี้ตามต้นแบบ (ถ้าชี้ไปฐานอื่น จะเขียนไว้เป็นหมายเหตุให้ตรวจก่อน)';
      // Either side: the sync script and the rollback script stay each other's mirror.
      if (namePartCount(base.from) >= 3 || namePartCount(base.to) >= 3) return 'synonym นี้ชี้ไปฐานอื่นหรือ server อื่น ซึ่งชื่อมักต่างกันในแต่ละที่ sync จึงเขียนคำสั่งไว้เป็นหมายเหตุให้ตรวจแล้วทำเอง';
      return 'sync จะลบแล้วสร้างใหม่ให้ชี้ตามต้นแบบ';
    }
    if (row.cat === 'Column') {
      if (has('Identity') || has('Computed')) return 'IDENTITY และสูตรคำนวณแก้ด้วยคำสั่งไม่ได้ ต้องสร้างคอลัมน์ใหม่' + BY_HAND;
      if (only('Ordinal')) return 'ลำดับคอลัมน์ต่างกัน sync ไม่ย้ายให้ (ต้องสร้างตารางใหม่ถึงจะย้ายได้)';
      // ALTER COLUMN says the type again, and a type that could not be read cannot be written.
      if ((has('Nullable') || has('Collation')) && parsed.notes.some(n => n.key === 'Type')) {
        return 'ชนิดข้อมูลอ่านไม่ได้ฝั่งหนึ่ง และคำสั่งแก้ต้องระบุชนิด sync จึงไม่เขียนคำสั่งให้ มีแต่หมายเหตุ';
      }
      // The type, NULL / NOT NULL and collation are changed with ALTER COLUMN. A default and
      // PERSISTED are not: those are always statements.
      const alter = mayDiffer('Type') || mayDiffer('Nullable') || mayDiffer('Collation');
      // PERSISTED is a property of computed columns only, and ALTER COLUMN changes nothing
      // else of one.
      if (has('Persisted') && alter) {
        return 'เป็นคอลัมน์คำนวณ: sync จะแก้ให้เฉพาะการเก็บค่า (PERSISTED) ส่วนชนิดข้อมูล, NULL และ collation แก้ด้วยคำสั่งไม่ได้ sync ' + NOTE;
      }
      // A type change needs the default of the column dropped first, and the script does not
      // drop a default that could not be read. The target's: it is there, so that is certain.
      const hiddenDefault = parsed.notes.filter(n => n.key === 'Default')[0];
      if (has('Type') && hiddenDefault && hiddenDefault.side !== 'source') {
        return 'จะเปลี่ยนชนิดข้อมูลต้องลบค่าเริ่มต้นก่อน แต่ค่าเริ่มต้นของปลายทางอ่านไม่ได้ sync จึง' + NOTE;
      }
      // Nothing is struck through when no line of the detail could be read as from -> to.
      const changed = parsed.changes.length ? 'sync จะแก้ปลายทางจากค่าที่ขีดฆ่าเป็นค่าใหม่' : 'sync จะแก้ปลายทางให้ตรงต้นแบบ';
      const order = has('Ordinal') ? ' ยกเว้นลำดับคอลัมน์ ซึ่ง sync ไม่ย้ายให้' : '';
      if (!alter) return changed + order;
      // What the row does not show: whether the column is computed, or used by a computed
      // column (SQL Server alters neither), and for a collation alone whether its type is a
      // user-defined one (COLLATE cannot be written for it). The script writes comments then.
      const unless = ['เป็นคอลัมน์คำนวณ', 'มีคอลัมน์คำนวณใช้คอลัมน์นี้'];
      if (!mayDiffer('Type') && !mayDiffer('Nullable')) unless.push('เป็นคอลัมน์ของ type ที่สร้างเอง');
      // The model's default cannot be put back after a type change when the target has one.
      if (has('Type') && hiddenDefault) unless.push('ปลายทางมีค่าเริ่มต้นอยู่');
      return changed + order + UNLESS(unless);
    }
    if (TABLE_CHILDREN.indexOf(row.cat) >= 0) {
      if (leafOf(row).pk) return 'primary key ต่างกัน ต้องลบ foreign key ที่อ้างถึงก่อน' + BY_HAND;
      if (only('Name')) return 'ของข้างในเหมือนกัน ต่างกันแค่ชื่อ sync จะเปลี่ยนชื่อให้ตรงต้นแบบ';
      if (only('State')) return 'sync จะเปิดหรือปิดให้ตรงต้นแบบ';
      // The model's own filter cannot be read: nothing can be written to put in its place.
      if (parsed.notes.some(n => n.key === 'Filter' && n.side !== 'target')) return 'เงื่อนไขกรองของต้นแบบอ่านไม่ได้ sync จึงไม่แก้ให้ มีแต่หมายเหตุ';
      const replaced = 'sync จะลบของเดิมแล้วสร้างใหม่ตามต้นแบบ';
      if (row.cat !== 'Index') return replaced;
      const onView = Boolean(row.group) && row.group.kind === 'view';
      // An index of a view the script writes again is created with that view.
      if (onView && viewIsRewritten(self)) return replaced;
      // from: what the target has, to: what the model has.
      const type = change('Type');
      if (type) {
        // Columnstore, XML, spatial: the script cannot write what would replace the index.
        if (PLAIN_INDEX.indexOf(type.to) < 0) return 'index แบบ ' + type.to + ' sync เขียนคำสั่งสร้างไม่ได้ จึงไม่ลบของเดิม มีแต่หมายเหตุให้ทำเอง';
        // Dropping the clustered index of a view drops every other index of that view.
        if (onView && (type.to === 'CLUSTERED' || type.from === 'CLUSTERED')) return 'clustered index ของ view ต่างกัน ถ้าลบ index อื่นของ view จะหายไปด้วย sync จึง' + NOTE;
        return replaced;
      }
      // The kind of index is the same on both sides, so the row does not show it.
      if (onView) return replaced + UNLESS(['เป็น clustered index ของ view']);
      return replaced + UNLESS(['เป็น index แบบ columnstore, XML หรือ spatial']);
    }
    // Views, procedures, functions and triggers.
    const hiddenCode = parsed.notes.some(n => n.key === 'Definition');
    if (only('State')) return 'sync จะเปิดหรือปิดให้ตรงต้นแบบ';
    if (hiddenCode) return 'โค้ดอ่านไม่ได้ฝั่งหนึ่ง sync จึงไม่เขียนคำสั่งให้ มีแต่หมายเหตุ';
    if (has('Type') || has('Table')) return 'แก้ด้วย ALTER ไม่ได้ ต้องลบแล้วสร้างใหม่' + BY_HAND;
    if (parsed.code) return 'โค้ดข้างในต่างกัน sync จะแทนด้วยโค้ดของต้นแบบ';
    return 'sync จะสร้างซ้ำด้วยโค้ดเดิมและค่า SET ของต้นแบบ';
  }

  // For a row whose only difference is the SET options a module was created under: what that
  // means, in two short lines. Nothing for any other row.
  function setOptionsHint(parsed) {
    if (parsed.code || parsed.changes.length !== 1 || parsed.changes[0].key !== 'SetOptions' || parsed.notes.length || parsed.raw.length) return [];
    const values = parsed.changes[0].from + ' ' + parsed.changes[0].to;
    const lines = ['โค้ดเหมือนกันทุกบรรทัด ต่างกันแค่ค่า SET ที่ถูกบันทึกไว้ตอนสร้าง object นี้ (ค่า "ปกติ" คือ ON)'];
    const quoted = 'QUOTED_IDENTIFIER OFF: ข้อความใน "..." ถูกอ่านเป็นข้อความธรรมดา และ object แบบนี้แก้ข้อมูลในตารางที่มี filtered index หรือ indexed view ไม่ได้ มักเกิดจากสร้างด้วยเครื่องมืออย่าง sqlcmd ที่ไม่ใส่ -I';
    const ansi = 'ANSI_NULLS OFF: เทียบ = NULL แล้วเป็นจริงได้ (แบบเก่า)';
    const hasQuoted = values.indexOf('QUOTED_IDENTIFIER OFF') >= 0, hasAnsi = values.indexOf('ANSI_NULLS OFF') >= 0;
    if (hasQuoted && hasAnsi) lines.push(quoted + ' ส่วน ' + ansi);
    else if (hasQuoted) lines.push(quoted);
    else if (hasAnsi) lines.push(ansi);
    return lines;
  }

  // The facts worth showing for a row that is on one side only. Left out: the object type of a
  // module (the category says it) and the table of a trigger (its card, or its name, says it).
  function shownFacts(row, parsed) {
    if (MODULES.indexOf(row.cat) < 0) return parsed.facts;
    return parsed.facts.filter(f => f.key !== 'Type' && f.key !== 'Table');
  }

  // Groups the rows: one group per table (the table's own row, if it has one, and everything
  // on it), and the rest. A view with rows on it (its indexes, its triggers) is one entry of the
  // rest, with those rows under it. Keys are matched ignoring case, as the engine matches names.
  // order: the categories in report order.
  function groupRows(rows, order) {
    const fold = key => String(key).toLowerCase();
    const tables = new Map(), views = new Map(), others = [];
    rows.forEach(row => {
      const g = row.group;
      if (!g) { others.push({ kind: 'single', cat: row.cat, key: '', name: row.obj, self: row, items: [] }); return; }
      const map = g.kind === 'view' ? views : tables;
      const id = fold(g.key);
      if (!map.has(id)) {
        const group = { kind: g.kind, cat: g.kind === 'view' ? 'View' : 'Table', key: g.key, name: g.key, self: null, items: [] };
        map.set(id, group);
        if (g.kind === 'view') others.push(group);
      }
      const group = map.get(id);
      if (row.cat === group.cat) { group.self = row; group.name = row.obj; }
      else group.items.push(row);
    });
    const rank = c => { const i = (order || []).indexOf(c); return i < 0 ? 999 : i; };
    const byName = (a, b) => fold(a.name) < fold(b.name) ? -1 : fold(a.name) > fold(b.name) ? 1 : 0;
    const sortItems = group => group.items.sort((a, b) => rank(a.cat) - rank(b.cat) || a.id - b.id);
    const tableList = Array.from(tables.values()).sort(byName);
    tableList.forEach(sortItems);
    others.forEach(sortItems);
    others.sort((a, b) => rank(a.cat) - rank(b.cat) || byName(a, b));
    return { tables: tableList, others };
  }

  // The chip in the header of a table's card (or of a view that has rows on it).
  function groupStatus(group) {
    const thing = group.kind === 'view' ? 'view ' : 'ตาราง';
    const whole = group.kind === 'view' ? '' : 'ทั้งตาราง';
    const self = group.self;
    if (self && self.status === 'OnlyInSource') {
      return { cls: KIND.OnlyInSource.cls, sym: KIND.OnlyInSource.sym, text: TIMELINE ? thing + 'หายไป' + whole : thing + 'ใหม่' + whole };
    }
    if (self && self.status === 'OnlyInTarget') {
      return { cls: KIND.OnlyInTarget.cls, sym: KIND.OnlyInTarget.sym, text: TIMELINE ? thing + 'เพิ่มขึ้นมา' + whole : thing + 'เกินมา' + whole };
    }
    const all = (self ? [self] : []).concat(group.items);
    if (all.length && all.every(r => r.status === 'Unverified')) return { cls: 'unk', sym: '?', text: 'มีของที่ตรวจไม่ได้' };
    return { cls: 'chg', sym: '~', text: TIMELINE ? 'ของข้างในเปลี่ยนไป' : 'มีของข้างในต่างกัน' };
  }

  function lineKey(s) {
    // Same rule as the engine: CREATE OR ALTER is stored as "CREATE   PROCEDURE", so that run
    // of keywords does not count as a change.
    let k = s.replace(/^(\s*)CREATE\s+(?:OR\s+ALTER\s+)?/i, '$1CREATE ');
    if (meta.ignoreWhitespace) k = k.replace(/\s+/g, ' ').trim();
    if (meta.ignoreCase) k = k.toLowerCase();
    return k;
  }

  // Line diff: trims the common head and tail, then runs an LCS on the changed middle.
  function diffLines(a, b) {
    const ka = a.map(lineKey), kb = b.map(lineKey);
    let start = 0;
    while (start < a.length && start < b.length && ka[start] === kb[start]) start++;
    let endA = a.length, endB = b.length;
    while (endA > start && endB > start && ka[endA - 1] === kb[endB - 1]) { endA--; endB--; }
    const ops = [];
    for (let i = 0; i < start; i++) ops.push([' ', a[i]]);
    const n = endA - start, m = endB - start;
    if (n * m > 4000000) {
      for (let i = start; i < endA; i++) ops.push(['-', a[i]]);
      for (let j = start; j < endB; j++) ops.push(['+', b[j]]);
    } else {
      const w = m + 1;
      const L = new Uint32Array((n + 1) * w);
      for (let i = n - 1; i >= 0; i--) {
        for (let j = m - 1; j >= 0; j--) {
          L[i * w + j] = ka[start + i] === kb[start + j]
            ? L[(i + 1) * w + j + 1] + 1
            : Math.max(L[(i + 1) * w + j], L[i * w + j + 1]);
        }
      }
      let i = 0, j = 0;
      while (i < n && j < m) {
        if (ka[start + i] === kb[start + j]) { ops.push([' ', a[start + i]]); i++; j++; }
        else if (L[(i + 1) * w + j] >= L[i * w + j + 1]) { ops.push(['-', a[start + i]]); i++; }
        else { ops.push(['+', b[start + j]]); j++; }
      }
      while (i < n) { ops.push(['-', a[start + i]]); i++; }
      while (j < m) { ops.push(['+', b[start + j]]); j++; }
    }
    for (let i = endA; i < a.length; i++) ops.push([' ', a[i]]);
    return ops;
  }

  // The unified diff of a module that differs. a is the "before" side (red, -) and b the "after"
  // side (green, +): the target now and the source model, or the two points in time of a drift.
  function renderDiff(row) {
    const a = TIMELINE ? row.a : row.b, b = TIMELINE ? row.b : row.a;
    const ops = diffLines(a.split('\n'), b.split('\n'));
    const CONTEXT = 3;
    const show = new Uint8Array(ops.length);
    ops.forEach((op, i) => {
      if (op[0] === ' ') return;
      for (let k = Math.max(0, i - CONTEXT); k <= Math.min(ops.length - 1, i + CONTEXT); k++) show[k] = 1;
    });
    let html = '', la = 0, lb = 0, hidden = 0;
    const gap = count => `<tr class="gap"><td colspan="4">… ${count} บรรทัดที่เหมือนกัน</td></tr>`;
    ops.forEach((op, i) => {
      const t = op[0];
      if (t !== '+') la++;
      if (t !== '-') lb++;
      if (!show[i]) { hidden++; return; }
      if (hidden) { html += gap(hidden); hidden = 0; }
      const cls = t === '-' ? 'del' : t === '+' ? 'add' : 'ctx';
      html += `<tr class="${cls}"><td class="ln">${t !== '+' ? la : ''}</td><td class="ln">${t !== '-' ? lb : ''}</td>` +
        `<td class="sig">${t === '-' ? '−' : t === '+' ? '+' : ''}</td><td>${esc(op[1])}</td></tr>`;
    });
    if (hidden) html += gap(hidden);
    const cap = TIMELINE
      ? '<span><span class="m del">− แดง</span> = บรรทัดเดิมในจุด "ก่อน" (หายไป)</span><span><span class="m add">+ เขียว</span> = บรรทัดใหม่ในจุด "หลัง"</span><span>เลขบรรทัด: ก่อน | หลัง</span>'
      : '<span><span class="m del">− แดง</span> = บรรทัดในปลายทางตอนนี้ (จะหายไป)</span><span><span class="m add">+ เขียว</span> = บรรทัดจากต้นแบบ (จะใส่แทน)</span><span>เลขบรรทัด: ปลายทาง | ต้นแบบ</span>';
    return `<div class="code"><div class="cap">${cap}</div><table>${html}</table></div>`;
  }

  // The code of a module that is on one side only.
  function renderPlain(row) {
    const fromSource = row.a !== null && row.a !== undefined;
    const text = fromSource ? row.a : row.b;
    const cap = TIMELINE
      ? (fromSource ? 'โค้ดในจุด "ก่อน" (จุด "หลัง" ไม่มีแล้ว)' : 'โค้ดในจุด "หลัง"')
      : (fromSource ? 'โค้ดของต้นแบบ (sync จะสร้างในปลายทาง)' : 'โค้ดของปลายทาง');
    const lines = text.split('\n').map((l, i) => `<tr><td class="ln">${i + 1}</td><td>${esc(l)}</td></tr>`).join('');
    return `<div class="code"><div class="cap">${cap}</div><table>${lines}</table></div>`;
  }

  // ---- choosing the rows of a sync script ----
  // Where this page can ask the app for a script: a sync report that the app serves, at
  // /runs/<id>/<report>.html. Opened as a file (or anywhere else) there is nobody to ask, and nothing
  // of the selection shows. A drift report has none: its script is already the way back.
  function selectionTarget(location) {
    if (TIMELINE) return null;
    if (location.protocol !== 'http:' && location.protocol !== 'https:') return null;
    const m = /^\/runs\/([^/]+)\/([^/]+\.html)$/.exec(location.pathname);
    if (!m) return null;
    try { return { id: decodeURIComponent(m[1]), report: decodeURIComponent(m[2]) }; } catch (e) { return null; }
  }
  // What is sent to the app for the script of the ticked rows: each row once, in order, as numbers.
  function scriptRequest(target, kind, ids) {
    const rows = Array.from(new Set(Array.from(ids))).sort((a, b) => a - b);
    return { url: '/api/runs/' + encodeURIComponent(target.id) + '/script', body: { report: target.report, kind, rows } };
  }
  // The box of a card: all of the rows it shows are ticked, some of them, or none.
  function tickState(ids, chosen) {
    const n = ids.filter(id => chosen.has(id)).length;
    return !n ? 'none' : n === ids.length ? 'all' : 'some';
  }
  const pickLabel = r => KIND[r.status].t + ': ' + r.obj;
  // need: { object, needs } from the app, a chosen row that needs a new table which is not chosen.
  const needText = n => `${n.object} ต้องใช้ตาราง ${n.needs} ซึ่งเป็นของใหม่และยังไม่ได้เลือก ถ้าไม่เลือกด้วย คำสั่งของ ${n.object} จะรันไม่ผ่านจนกว่าตารางนั้นจะมีอยู่`;
  const savedText = (name, selected, total) => `ได้ไฟล์ ${name} จากที่เลือก ${selected} จาก ${total} รายการ`;
  const shownText = (name, selected, total) => `เปิดดูไฟล์ ${name} ในแท็บใหม่แล้ว (เลือก ${selected} จาก ${total} รายการ)`;

  // A page of its own that shows a script: the text to read, and buttons to copy it and to download it. It holds
  // the text itself, so it keeps working when the report that made it is closed. The text is the file as the app
  // made it, BOM included, for the download; what is shown and copied has no BOM, which would paste into SSMS as
  // a character nobody sees.
  function viewerPage(data) {
    const text = String(data.text);
    const shown = text.replace(/^\uFEFF/, '');
    // In a script of a page, the text may hold the tag that ends the script, or a comment opener: so "<" is
    // written <, and a line separator is escaped too.
    const embed = v => JSON.stringify(v).replace(/</g, '\\u003c').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029');
    const css = 'body{margin:0;background:#0b0d13;color:#f2f3f5;font:15px/1.6 "Leelawadee UI","Segoe UI",Tahoma,system-ui,sans-serif}' +
      '.bar{position:sticky;top:0;display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:10px 16px;background:#171b26;border-bottom:1px solid rgba(255,255,255,.14)}' +
      '.bar h1{font-size:16px;margin:0;font-weight:650;overflow-wrap:anywhere}.bar .sub{color:#a3a6b0;font-size:14px}.bar .sp{flex:1}' +
      '.bar button{font:inherit;font-size:14px;color:#f2f3f5;background:#2a3040;border:1px solid rgba(255,255,255,.28);border-radius:999px;padding:5px 16px;cursor:pointer}' +
      '.bar button.primary{background:#0a84ff;border-color:#6cb2ff;font-weight:650}.bar #say{color:#34d65c;font-size:14px}' +
      'pre{margin:0;padding:16px;font:14px/1.55 Consolas,"Cascadia Mono","Leelawadee UI",monospace;white-space:pre-wrap;overflow-wrap:anywhere}';
    const script = `var TEXT = ${embed(text)}, NAME = ${embed(data.name)};
var BODY = TEXT.charAt(0) === '\\uFEFF' ? TEXT.slice(1) : TEXT;
function say(t) { document.getElementById('say').textContent = t; }
document.getElementById('copy').addEventListener('click', function () {
  function fallback() {
    var ta = document.createElement('textarea');
    ta.value = BODY; document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    say(ok ? 'คัดลอกแล้ว' : 'คัดลอกไม่สำเร็จ ลากคลุมข้อความแล้วกด Ctrl+C');
  }
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(BODY).then(function () { say('คัดลอกแล้ว'); }, fallback);
  else fallback();
});
document.getElementById('save').addEventListener('click', function () {
  var a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([TEXT], { type: 'text/plain;charset=utf-8' }));
  a.download = NAME; document.body.appendChild(a); a.click(); a.remove();
  say('ดาวน์โหลดแล้ว');
});`;
    return '<!doctype html><html lang="th"><head><meta charset="utf-8"><title>' + esc(data.name) + '</title><style>' + css + '</style></head><body>' +
      '<div class="bar"><div><h1>' + esc(data.name) + '</h1><div class="sub">เลือก ' + data.selected + ' จาก ' + data.total + ' รายการ · อ่านแล้วคัดลอกไปวางใน SSMS ได้เลย</div></div>' +
      '<span class="sp"></span><span id="say" role="status"></span><button id="copy" class="primary">คัดลอก</button><button id="save">ดาวน์โหลด</button></div>' +
      '<pre id="text">' + esc(shown) + '</pre><script>' + script + '<\/script></body></html>';
  }

  return {
    TIMELINE, KIND, CAT, SIDE, HIDDEN_DEFINITION, esc, cat, catWord, propLabel, val, toRows, parseDetail, leafOf, sentence,
    setOptionsHint, shownFacts, groupRows, groupStatus, lineKey, diffLines, renderDiff, renderPlain,
    selectionTarget, scriptRequest, tickState, pickLabel, needText, savedText, shownText, viewerPage
  };
}

// The page itself. Not run where there is no document (the tests).
if (typeof document !== 'undefined') (function () {
  'use strict';
  const core = createReportCore(META);
  const KIND = core.KIND, esc = core.esc, TIMELINE = core.TIMELINE;
  const rows = core.toRows(DATA);
  const parsed = rows.map(core.parseDetail);
  const groups = core.groupRows(rows, META.categories);
  const state = { q: '', status: 'all', cat: 'all' };
  const $ = id => document.getElementById(id);

  // ---- choosing the rows of a script: the state, and the box that goes with a row ----
  // target: where the app can be asked for the script of the ticked rows, or null (a file, a drift report).

  const chosen = new Set();

  // The box of a table's card: ticks the rows that the card shows.

    ? `<label class="pickg-l"><input type="checkbox" class="pickg" data-pickg="${groups.tables.indexOf(g)}">เลือกทั้งตาราง</label>`
    : '');

  // ---- header ----
  const title = TIMELINE ? 'โครงสร้างฐานข้อมูลที่เปลี่ยนไป (schema drift)' : 'เทียบโครงสร้างฐานข้อมูล';
  document.title = title;
  $('title').textContent = title;
  $('m-source').textContent = META.source;
  $('m-target').textContent = META.target;
  if (TIMELINE) {
    $('role-source').textContent = 'ก่อน: จุดเริ่ม (จาก)';
    $('role-target').textContent = 'หลัง: จุดที่เอามาเทียบ (ถึง)';
    $('arrow-text').textContent = 'เวลาผ่านไป';

  } else {
    $('card-source').classList.add('model');
    $('role-source').textContent = 'ต้นแบบ: ตัวที่ถูกต้อง (source)';
    $('role-target').textContent = 'ปลายทาง: ตัวที่จะถูกปรับ (target)';
    $('arrow-text').textContent = 'ปรับให้เหมือน';
    $('lead').textContent = 'รายงานนี้บอกว่าปลายทางต่างจากต้นแบบตรงไหน และไฟล์ sync จะทำอะไรกับปลายทางเพื่อให้เหมือนต้นแบบ (รายงานนี้ไม่ได้แก้ฐานข้อมูลใดๆ) กดกล่องด้านล่างเพื่อดูเฉพาะแบบนั้น';
  }
  const options = [

    META.ignoreCollation ? 'ไม่เทียบ collation' : '', META.compareColumnOrder ? 'เทียบลำดับคอลัมน์ด้วย' : ''
  ].filter(Boolean);
  $('m-options').textContent = 'สร้างเมื่อ ' + META.generated + ' · หมวดที่เทียบ: ' + META.categories.map(core.cat).join(', ') +
    (options.length ? ' · ตัวเลือก: ' + options.join(', ') : '');

  // A side read without VIEW DEFINITION: objects hidden from that login show as being on the
  // other side only, and definitions it cannot read as "cannot check".
  const incomplete = (META.noViewDefinition || []).map(w => {
    const seenAs = KIND[w[0] === 'target' ? 'OnlyInSource' : 'OnlyInTarget'].t;
    return `<div class="warn"><b>ผลเทียบไม่ครบ</b>login ${esc(w[1])} ไม่มีสิทธิ์ VIEW DEFINITION ใน${core.SIDE[w[0]]}: ` +
      `ของที่ login นี้มองไม่เห็นจะขึ้นเป็น "${seenAs}" ทั้งที่อาจมีอยู่จริง และโค้ดที่อ่านไม่ได้จะขึ้นเป็น "${KIND.Unverified.t}"</div>`;
  });
  // Any other warning of the engine is shown as it wrote it.
  const otherWarnings = (META.warnings || []).filter(w => !(incomplete.length && /has no VIEW DEFINITION permission/.test(w)))
    .map(w => `<div class="warn"><b>ผลเทียบไม่ครบ</b>${esc(w)}</div>`);
  $('warnings').innerHTML = incomplete.concat(otherWarnings).join('');
  $('warnings').hidden = !(incomplete.length + otherWarnings.length);

  const total = s => rows.filter(r => r.status === s).length;

  function renderLegend() {
    $('legend').innerHTML = Object.keys(KIND).map(k => {
      const K = KIND[k], on = state.status === k;
      return `<button class="kind ${K.cls}${on ? ' on' : ''}" data-status="${k}" aria-pressed="${on}">` +
        `<span class="top"><span class="n">${total(k)}</span><span class="t">${K.sym} ${K.t}</span></span><span class="d">${esc(K.d)}</span></button>`;
    }).join('');
  }

  function renderFilters() {
    const used = META.categories.filter(c => rows.some(r => r.cat === c));
    $('f-cat').innerHTML = `<option value="all">ทุกชนิด (${rows.length})</option>` +
      used.map(c => `<option value="${esc(c)}">${esc(core.cat(c))} (${rows.filter(r => r.cat === c).length})</option>`).join('');
  }

  function matches(r) {
    if (state.status !== 'all' && r.status !== state.status) return false;
    if (state.cat !== 'all' && r.cat !== state.cat) return false;
    if (!state.q) return true;
    const text = r.obj + '\n' + r.detail + '\n' + (r.group ? r.group.key : '');
    return text.toLowerCase().indexOf(state.q) >= 0;
  }

  // An object name: a long one may break after a dot or an underscore before it breaks anywhere.
  const nameHtml = s => esc(s).replace(/([._])(?=\S)/g, '$1<wbr>');
  const chip = s => `<span class="chip ${s.cls}">${s.sym} ${esc(s.text)}</span>`;
  const rowChip = r => chip({ cls: KIND[r.status].cls, sym: KIND[r.status].sym, text: KIND[r.status].t });
  const symbol = r => `<span class="sym ${KIND[r.status].cls}" title="${KIND[r.status].t}">${KIND[r.status].sym}</span>`;

  function codeHtml(r) {
    const one = r.a !== null ? r.a : r.b;
    if (one === null) return '';
    if (r.status !== 'Different' && one === core.HIDDEN_DEFINITION) return '<div class="say">อ่านโค้ดไม่ได้ (ถูกเข้ารหัส เป็น CLR หรือไม่มีสิทธิ์ VIEW DEFINITION)</div>';
    return `<button class="linkbtn" data-code="${r.id}" aria-expanded="false">${codeLabel(r, false)}</button><div class="codebox" id="code-${r.id}" hidden></div>`;
  }
  const codeLabel = (r, open) => (open ? 'ซ่อนโค้ด' : r.status === 'Different' ? 'ดูว่าโค้ดต่างกันตรงไหน' : 'ดูโค้ด');

  // What is said about one row: the sentence, then the details.
  function bodyHtml(r, self) {
    const p = parsed[r.id];
    let h = `<div class="say">${esc(core.sentence(r, p, { self }))}</div>`;
    if (p.changes.length) {
      h += '<div class="changes">' + p.changes.map(c =>
        `<div class="ch"><span class="p">${esc(c.label)}</span><span class="ft"><span class="sr">เดิม </span><span class="from">${esc(c.from)}</span>` +
        `<span class="arr" aria-hidden="true">&rarr;</span><span class="sr">ใหม่ </span><span class="to">${esc(c.to)}</span></span></div>`).join('') + '</div>';
    }
    const facts = core.shownFacts(r, p);
    if (facts.length) h += '<div class="facts">' + facts.map(f => `<span>${esc(f.label)}: <b>${esc(f.value)}</b></span>`).join('') + '</div>';
    h += p.notes.map(n => `<div class="say">${esc(n.text)}</div>`).join('');
    h += p.raw.map(t => `<div class="rawline">${esc(t)}</div>`).join('');
    const hint = core.setOptionsHint(p);
    if (hint.length) h += `<div class="hint">${hint.map(esc).join('<br>')}</div>`;
    return h + codeHtml(r);
  }

  // One row of a table's card, or of a view: symbol, what it is, what happens.
  function itemHtml(r, self) {
    const leaf = core.leafOf(r);
    return `<div class="titem">${pickCell(r)}${symbol(r)}<div class="what">${esc(leaf.kind)}<b>${nameHtml(leaf.name)}</b></div>` +
      `<div class="body"><span class="sr">${KIND[r.status].t}</span>${bodyHtml(r, self)}</div></div>`;
  }

  // The rows of a group that pass the filter; the group's own row counts as one.
  function visible(group) {
    const self = group.self && matches(group.self) ? group.self : null;
    const items = group.items.filter(matches);
    return { self, items, count: items.length + (self ? 1 : 0) };
  }

  function tableHtml(group, v) {
    let h = `<div class="panel tcard"><div class="tcard-h"><span class="obj">${nameHtml(group.name)}</span>${chip(core.groupStatus(group))}` +
      `<span class="note">${v.count} รายการ</span>${groupBox(group)}</div>`;
    if (v.self) {
      h += `<div class="titem">${pickCell(v.self)}${symbol(v.self)}<div class="what">${esc(core.cat('Table'))}<b>ทั้งตาราง</b></div>` +
        `<div class="body">${bodyHtml(v.self, null)}</div></div>`;
    }
    return h + v.items.map(r => itemHtml(r, group.self)).join('') + '</div>';
  }

  function otherHtml(group, v) {
    const self = v.self;
    const name = group.kind === 'single' && group.cat === 'Database' ? core.cat('Database') : group.name;
    let h = `<div class="row">${pickCell(self)}<div>${self ? rowChip(self) : chip(core.groupStatus(group))}</div><div class="body">` +
      `<div class="obj">${nameHtml(name)}${group.cat === 'Database' ? '' : ` <span class="note">${esc(core.cat(group.cat))}</span>`}</div>`;
    if (self) h += bodyHtml(self, null);
    else if (group.self) h += '<div class="say">ตัว view ไม่ตรงกับตัวกรองนี้ ด้านล่างคือของที่อยู่บน view นี้</div>';
    else h += `<div class="say">${TIMELINE ? 'ตัว view เหมือนเดิม ที่เปลี่ยนคือของที่อยู่บน view นี้' : 'ตัว view เหมือนกัน ที่ต่างคือของที่อยู่บน view นี้'}</div>`;
    if (v.items.length) h += '<div class="kids">' + v.items.map(r => itemHtml(r, group.self)).join('') + '</div>';
    return h + '</div></div>';
  }

  function renderResults() {
    const shown = rows.filter(matches).length;
    $('count').textContent = `แสดง ${shown} จาก ${rows.length} รายการ`;
    $('clear').hidden = state.status === 'all' && state.cat === 'all' && !state.q;
    $('results').classList.toggle('selecting', selecting);
    if (!rows.length) {
      $('results').innerHTML = '<div class="panel empty">' + (incomplete.length + otherWarnings.length
        ? 'ไม่พบความต่างในส่วนที่อ่านได้ (ผลเทียบไม่ครบ ดูคำเตือนด้านบน)'
        : TIMELINE ? 'ไม่มีอะไรเปลี่ยน โครงสร้างเหมือนเดิม' : 'ไม่มีความต่าง โครงสร้างตรงกัน') + '</div>';
      return;
    }
    if (!shown) {
      $('results').innerHTML = '<div class="panel empty">ไม่มีรายการที่ตรงกับตัวกรอง</div>';
      return;
    }
    let html = '';
    const tables = groups.tables.map(g => [g, visible(g)]).filter(x => x[1].count);
    if (tables.length) {
      html += `<div class="group-h"><h2>ตาราง</h2><span class="note">${tables.length} ตาราง รวมคอลัมน์ index constraint และ trigger ของแต่ละตาราง</span></div>` +
        '<div class="tables">' + tables.map(x => tableHtml(x[0], x[1])).join('') + '</div>';
    }
    const others = groups.others.map(g => [g, visible(g)]).filter(x => x[1].count);
    if (others.length) {
      html += '<div class="group-h"><h2>โค้ดและของอื่น</h2><span class="note">view, procedure, function, type, sequence, synonym, schema, database trigger</span></div>' +
        '<div class="panel rows">' + others.map(x => otherHtml(x[0], x[1])).join('') + '</div>';
    }
    $('results').innerHTML = html;
    syncGroupBoxes();
  }

  function renderTotals() {
    $('totals').innerHTML = '<summary>ดูจำนวน object ที่อ่านได้ของแต่ละฝั่ง</summary><table><thead><tr><th>หมวด</th>' +
      `<th>${TIMELINE ? 'ก่อน' : 'ต้นแบบ'}</th><th>${TIMELINE ? 'หลัง' : 'ปลายทาง'}</th><th>รายการในรายงาน</th></tr></thead><tbody>` +
      META.summary.map(s => `<tr><td>${esc(core.cat(s[0]))}</td><td>${s[1]}</td><td>${s[2]}</td><td>${s[3] + s[4] + s[5] + s[6]}</td></tr>`).join('') +
      '</tbody></table>';
  }

  function refresh() { renderLegend(); renderResults(); }

  $('legend').addEventListener('click', e => {
    const card = e.target.closest('.kind');
    if (!card) return;
    state.status = state.status === card.dataset.status ? 'all' : card.dataset.status;
    refresh();
  });
  let timer = 0;
  $('q').addEventListener('input', e => {
    clearTimeout(timer);
    timer = setTimeout(() => { state.q = e.target.value.trim().toLowerCase(); renderResults(); }, 150);
  });
  $('f-cat').addEventListener('change', e => { state.cat = e.target.value; renderResults(); });
  $('clear').addEventListener('click', () => {
    state.q = ''; state.status = 'all'; state.cat = 'all';
    $('q').value = ''; $('f-cat').value = 'all';
    refresh();
  });
  $('results').addEventListener('click', e => {
    const btn = e.target.closest('[data-code]');
    if (!btn) return;
    const r = rows[Number(btn.dataset.code)];
    const box = $('code-' + r.id);
    if (!box.dataset.ready) {
      box.innerHTML = r.a === null || r.b === null ? core.renderPlain(r) : core.renderDiff(r);
      box.dataset.ready = '1';
    }
    box.hidden = !box.hidden;
    btn.setAttribute('aria-expanded', String(!box.hidden));
    btn.textContent = codeLabel(r, !box.hidden);
  });

  // ---- choosing the rows of a script: the boxes, the bar, and asking the app ----
  // The rows that a table's card shows now (the filter applies): what its box ticks.
  const groupIds = g => { const v = visible(g); return (v.self ? [v.self.id] : []).concat(v.items.map(r => r.id)); };

  function syncRowBoxes() {
    document.querySelectorAll('input.pick').forEach(box => { box.checked = chosen.has(Number(box.dataset.pick)); });
  }
  function syncGroupBoxes() {
    document.querySelectorAll('input.pickg').forEach(box => {
      const state = core.tickState(groupIds(groups.tables[Number(box.dataset.pickg)]), chosen);
      box.checked = state === 'all';
      box.indeterminate = state === 'some';
    });
  }
  function showMessage(m) {
    $('pick-msg').hidden = !m;
    if (!m) return;
    $('pick-msg').className = 'pickmsg ' + m.cls;
    $('pick-msg').innerHTML = m.html;
  }
  function updateBar() {
    const n = chosen.size;
    $('pickdock').hidden = !selecting;
    $('pick-count').textContent = n ? `เลือกแล้ว ${n} จาก ${rows.length} รายการ` : 'ยังไม่ได้เลือก ติ๊กช่องหน้ารายการที่ต้องการ';
    for (const id of ['pick-view-sync', 'pick-sync', 'pick-view-rollback', 'pick-rollback', 'pick-clear']) $(id).disabled = busy || !n;
    $('pick-toggle').setAttribute('aria-pressed', String(selecting));
    $('pick-toggle').textContent = selecting ? 'เลิกเลือก' : 'เลือกรายการเพื่อสร้าง script';
    $('pick-all').hidden = !selecting;
  }
  function setSelecting(on) {
    selecting = on;
    if (!on) { dropPending(); showMessage(null); }
    updateBar();
    renderResults();
  }
  // What waits for an answer about needs: the script, what to do with it, and the tab opened for it.
  function dropPending() {
    if (pending && pending.win && !pending.win.closed) pending.win.close();
    pending = null;
  }
  function changed() { showMessage(null); dropPending(); updateBar(); syncGroupBoxes(); }

  // The file goes to the person's downloads; its text keeps the BOM that the app sends, which SSMS needs for Thai text.
  function saveFile(data) {
    pending = null;
    const url = URL.createObjectURL(new Blob([data.text], { type: 'text/plain;charset=utf-8' }));
    const a = document.createElement('a');
    a.href = url; a.download = data.name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    showMessage({ cls: 'ok', html: esc(core.savedText(data.name, data.selected, data.total)) });
  }
  // The script in a tab of its own, to read and copy (see viewerPage). The tab is opened by the click, before the
  // script is made: a popup blocker lets nothing through after a wait. It says so while it waits.
  function openViewer() {
    const w = window.open('', '_blank');
    if (w) {
      w.document.open();
      w.document.write('<!doctype html><meta charset="utf-8"><title>กำลังสร้าง script</title><body style="background:#0b0d13;color:#f2f3f5;font:15px sans-serif;padding:24px">กำลังสร้าง script รายการมากอาจใช้เวลาครู่หนึ่ง</body>');
      w.document.close();
    }
    return w;
  }
  function showScript(data, win) {
    // The tab opened for it, or a new one when that was closed meanwhile (this runs from a click).
    const w = win && !win.closed ? win : window.open('', '_blank');
    if (!w) { showMessage({ cls: 'bad', html: '<b>เบราว์เซอร์บล็อกแท็บใหม่</b> อนุญาต popup ของหน้านี้ แล้วกดดูอีกครั้ง' }); return; }
    pending = null;
    w.document.open();
    w.document.write(core.viewerPage(data));
    w.document.close();
    showMessage({ cls: 'ok', html: esc(core.shownText(data.name, data.selected, data.total)) });
  }
  // action: 'save' downloads the file, 'view' shows it in a tab of its own.
  function deliver(data, action, win) { if (action === 'view') showScript(data, win); else saveFile(data); }
  function showNeeds(data, action, win) {
    pending = { data, action, win };
    // The tab opened for the script says what it waits for, not that the script is being made.
    if (win && !win.closed) win.document.body.textContent = 'ในหน้ารายงานมีข้อความให้ตัดสินใจก่อน (ตัวที่ต้องพึ่งของที่ไม่ได้เลือก) ตัดสินใจที่นั่น แล้วหน้านี้จะแสดง script';
    showMessage({ cls: 'need', html: '<b>ในที่เลือกมีตัวที่ต้องพึ่งของที่ไม่ได้เลือก</b><ul>' +
      data.needs.map(n => `<li>${esc(core.needText(n))}</li>`).join('') + '</ul>' +
      '<div class="acts"><button class="linkbtn" data-act="take">เลือกให้ด้วย</button>' +
      `<button class="linkbtn" data-act="go">${action === 'view' ? 'เปิดดูเลย' : 'ดาวน์โหลดเลย'}</button></div>` });
  }
  async function ask(kind, action) {
    if (busy || !chosen.size) return;
    const win = action === 'view' ? openViewer() : null;
    if (action === 'view' && !win) { showMessage({ cls: 'bad', html: '<b>เบราว์เซอร์บล็อกแท็บใหม่</b> อนุญาต popup ของหน้านี้ แล้วกดดูอีกครั้ง' }); return; }
    dropPending();
    busy = true;
    updateBar();
    showMessage({ cls: '', html: 'กำลังสร้างไฟล์ รายการมากอาจใช้เวลาครู่หนึ่ง' });
    const req = core.scriptRequest(target, kind, chosen);
    try {
      const res = await fetch(req.url, { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Database-Diff': '1' }, body: JSON.stringify(req.body) });
      let data = {};
      try { data = await res.json(); } catch (e) { data = {}; }
      if (!res.ok) throw new Error(data.error || 'แอปตอบ ' + res.status);
      if (data.needs && data.needs.length) showNeeds(data, action, win); else deliver(data, action, win);
    } catch (err) {
      if (win && !win.closed) win.close();
      showMessage({ cls: 'bad', html: `<b>สร้างไฟล์ไม่สำเร็จ</b> ${esc(err.message)}<br>รายงานนี้ต้องเปิดจากแอปที่กำลังทำงานอยู่` });
    } finally {
      busy = false;
      updateBar();
    }
  }

  if (target && rows.length) {
    $('pick-toggle').hidden = false;
    $('pick-toggle').addEventListener('click', () => setSelecting(!selecting));
    $('pick-all').addEventListener('click', () => { rows.filter(matches).forEach(r => chosen.add(r.id)); changed(); syncRowBoxes(); });
    $('pick-clear').addEventListener('click', () => { chosen.clear(); changed(); syncRowBoxes(); });
    $('pick-sync').addEventListener('click', () => ask('sync', 'save'));
    $('pick-rollback').addEventListener('click', () => ask('rollback', 'save'));
    $('pick-view-sync').addEventListener('click', () => ask('sync', 'view'));
    $('pick-view-rollback').addEventListener('click', () => ask('rollback', 'view'));
    $('results').addEventListener('change', e => {
      const one = e.target.closest('[data-pick]'), card = e.target.closest('[data-pickg]');
      if (one) {
        const id = Number(one.dataset.pick);
        if (one.checked) chosen.add(id); else chosen.delete(id);
      } else if (card) {
        for (const id of groupIds(groups.tables[Number(card.dataset.pickg)])) { if (card.checked) chosen.add(id); else chosen.delete(id); }
        syncRowBoxes();
      } else return;
      changed();
    });
    $('pick-msg').addEventListener('click', e => {
      const btn = e.target.closest('[data-act]');
      if (!btn || !pending) return;
      if (btn.dataset.act === 'go') { deliver(pending.data, pending.action, pending.win); return; }
      pending.data.needs.forEach(n => chosen.add(n.needsRow));
      dropPending();
      syncRowBoxes();
      syncGroupBoxes();
      updateBar();
      showMessage({ cls: 'ok', html: 'เลือกตารางที่ขาดให้แล้ว กดดาวน์โหลดอีกครั้ง' });
    });
  }

  renderFilters();
  renderTotals();
  refresh();
  updateBar();
  // The button "เลือกเอง" of the run page opens the report at #select.
  if (target && rows.length && location.hash === '#select') setSelecting(true);
})();
</script>
</body>
</html>
